<!DOCTYPE html>
<html lang="zh-Hant">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>開始作答</title>
 <style>
/* === Play：桌機版樣式，對齊 Quiz 的版型（維持你原本設定） === */
@media (min-width: 769px){
 body{
   background:#fff;
   background-image:url("{{ url_for('static', filename='12.png') }}");
   background-size:cover;
   background-position:center;
   background-repeat:no-repeat;
   background-attachment:fixed;
   text-align:center;
   padding-top:24px;

 }

 }

 .q-img{

 }
 .question > div:first-of-type{

 }

   display:flex; justify-content:center; gap:clamp(16px,4vw,40px);
   flex-wrap:wrap; margin-top:10px;
 }
 .opt{
   min-width:150px; padding:clamp(14px,2.5vw,20px) clamp(24px,5vw,40px);
   font-size:clamp(18px,2.2vw,24px); border:none; border-radius:16px; background:#f8f8f8;

 }
 .opt:active{ transform:scale(.96); }

 .btn{ font-size:18px; padding:10px 18px; border-radius:12px; box-shadow:0 6px 16px rgba(0,0,0,.12); }
}


/* === Play：手機版響應式（維持你原本設定） === */
@media (max-width:768px){
 html, body{ min-height:100vh !important; }
 body{
   padding-top:44px !important;
   background-image:url("{{ url_for('static', filename='phone3.jpg') }}") !important;
   background-size:cover !important; background-position:center top !important;

   padding-bottom: env(safe-area-inset-bottom, 12px) !important;

 }
 header{ background:transparent; padding:0 12px 8px; }
 .wrap{
   max-width:96vw !important; background:transparent !important; box-shadow:none !important;
   padding:6px 10px 10px !important; margin:0 auto;
 }
 .question{ display:flex; flex-direction:column; align-items:center; }
 .q-img{
   width:min(72vw,320px) !important; max-height:34vh !important; margin-top:20px !important;
   border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.15); object-fit:cover !important; object-position:center top !important;
 }
 .question > div:first-of-type{
   margin:10px auto 8px !important; font-size:clamp(18px,4.6vw,22px) !important; line-height:1.4 !important;
 }
 .opts{
   display:flex !important; justify-content:center !important; gap:12px !important;
   flex-wrap:wrap !important; margin-top:20px !important;
 }
 .opt{
   min-width:140px !important; padding:12px 18px !important; font-size:18px !important; border-radius:14px !important;
   border:none; background:#f8f8f8; box-shadow:0 2px 6px rgba(0,0,0,.15);
 }
 .row{ margin-top:12px !important; }
 .btn{ font-size:16px !important; padding:10px 16px !important; border-radius:12px !important; }

/* —— 隱藏原 header（改用進度列上的返回鈕） —— */
header{ display:none !important; }


/* 題號列：左=返回，中=題號，右=硬體按鈕 */
.progress-row{
 display:grid;
 grid-template-columns: 60px 1fr auto;
 align-items:center; justify-items:center;
 column-gap:12px; margin:8px auto 12px; width:min(92vw,980px);
}
.exit-icon{ background:transparent; border:none; padding:0; cursor:pointer; }
.exit-icon img{ width:60px; height:60px; transition:transform .2s; }
.exit-icon img:hover{ transform:scale(1.1); }


/* 題號圓點（與 Quiz 同版型） */
.progress{
 display:flex; align-items:center; justify-content:center;
 gap:10px; padding:0; margin:0; flex-wrap:wrap; max-width:1024px;
}
.dot{
 width:44px; height:44px; line-height:44px; font-size:20px; border-radius:50%;
 background:#eee; color:#333; text-align:center; user-select:none;
}
.dot.active{ background:#ffe600; font-weight:bold; }


/* 選項卡片（色彩由 JS 覆寫） */
.opts{ display:flex; justify-content:center; gap:clamp(16px,4vw,40px); flex-wrap:wrap; margin-top:10px; }
.opt{
 min-width:150px; padding:clamp(14px,2.5vw,20px) clamp(24px,5vw,40px);
 font-size:clamp(18px,2.2vw,24px); border:none; border-radius:16px; background:#f8f8f8;
 box-shadow:0 2px 6px rgba(0,0,0,.15); transition:transform .08s ease, opacity .2s ease; color:#fff;
}
.opt:active{ transform:scale(.96); }
.opt.selected{ outline:3px solid #00aaff; }


/* 右側硬體連線按鈕 */
.hw-btn{
 justify-self:end; border:none; border-radius:12px;
 padding:8px 14px; font-size:15px; cursor:pointer;
 background:#ffffff; box-shadow:0 2px 6px rgba(0,0,0,.20); white-space:nowrap;
}
.hw-btn.is-online{ background:#d2f8d2; box-shadow:0 2px 6px rgba(0,0,0,.15); }


@media (max-width:768px){
 .progress-row{
   width:92vw; margin:0 auto 6px;
   grid-template-columns: 48px 1fr auto; column-gap:10px;
 }
 .exit-icon img{ width:44px; height:44px; }
 .progress{ display:grid !important; grid-template-columns: repeat(5,40px) !important; grid-auto-rows:40px; gap:10px; margin:4px 0 2px; }
 .dot{ width:40px; height:40px; line-height:40px; font-size:20px; }
 .hw-btn{ padding:8px 10px; font-size:14px; }
}


/* 結算遮罩與置中浮層 */
.finish-mask{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:999; display:none; }
.finish-box{
 position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
 z-index:1000; max-width:640px; width:92vw; margin:0; display:none;
 background:rgba(255,255,255,0.95); box-shadow:0 6px 20px rgba(0,0,0,.12); border-radius:12px; padding:20px;
}
.finish-title{ font-size:20px; margin-bottom:12px; color:#333; }
.home-btn{ font-size:18px; padding:10px 18px; border-radius:12px; border:none; background:#00aaff; color:#fff; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.12); }
@media (max-width:768px){ .finish-box{ width:92vw; margin:10px auto; padding:16px; } }
.row{ display:none !important; }


/* —— 提前結束確認視窗（沿用 Quiz 互動） —— */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:2000;}
.modal-content{background:#fff;padding:30px 40px;border-radius:10px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.modal-content button{margin:10px 15px;font-size:20px;padding:12px 24px;border:none;border-radius:20px;cursor:pointer;}
.btn-yes{background:#ffe600}.btn-no{background:#f66;color:#fff}
 </style>
</head>
<body data-logout-url="{{ url_for('auth.logout') }}">
 <script src="{{ url_for('static', filename='js/parent_timer.js') }}?v=20251025-6"></script>


 <!-- 用 data-* 傳 set_id -->
 <div id="play-root" data-set-id="{{ set_id }}"></div>


 <!-- 進度列：左 提前結束 / 中 題號 / 右 硬體連線 -->
 <div class="progress-row">
   <button class="exit-icon" id="btnExit" aria-label="提前結束作答">
     <img src="{{ url_for('static', filename='exit.png') }}" alt="返回">
   </button>
   <div class="progress" id="progressBar" aria-label="作答進度"></div>
   <button id="hwBtn" class="hw-btn" type="button" aria-live="polite">連接硬體（未連線）</button>
 </div>


 <div class="wrap">
   <div id="stage">
     <div class="loading" id="loading">載入中……</div>
   </div>
 </div>


 <!-- 結束遮罩與面板 -->
 <div id="finishMask" class="finish-mask"></div>
 <div class="finish-box" id="finishBox" role="dialog" aria-modal="true" aria-live="polite" style="display:none;">
   <div class="finish-title" id="finishTitle">答題完成！</div>
   <div style="margin-bottom:12px;" id="finishSummary">總共答對 X / Y 題</div>
   <button class="home-btn" id="btnHome" onclick="location.href='{{ url_for('custom.page_list') }}'">返回清單 (6s)</button>
 </div>


 <!-- 提前結束確認 -->
 <div class="modal" id="exitModal" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
   <div class="modal-content">
     <p id="exitTitle">確定要提前結束作答嗎？</p>
     <button class="btn-yes" id="exitYes">是 ✓</button>
     <button class="btn-no"  id="exitNo">否 ✗</button>
   </div>
 </div>


 <!-- 中央倒數提醒容器（沿用家長計時器） -->
 <div id="sysWarnToast" class="sysset-toast" hidden></div>


 <script>
 const API_BASE = "/ai/custom";
 const SET_ID = parseInt(document.getElementById('play-root').dataset.setId, 10);
 const EMOS = ["開心","難過","生氣","害怕","驚訝","厭惡"];


 let QUESTIONS = [];
 let idx = 0;
 let cs_id = null;
 let startTs = null;


 // ===== 進/退行為（與 Quiz 一致的 TTS 管控） =====
 let waitingToAdvance = false; // 是否正在等待語音結束
 let pendingNext = null;       // 等待中的前進回呼
 let _ttsToken = 0;


 function _getTtsPrefs(){
   const r = parseFloat(localStorage.getItem('tts.rate') || '1.0');
   const en = (localStorage.getItem('tts.enabled') ?? '1') !== '0';
   return { rate: (isNaN(r) ? 1.0 : Math.min(2, Math.max(0.5, r))), enabled: en };
 }
 function pickPreferredVoice() {
   const voices = speechSynthesis.getVoices() || [];
   const by = (fn) => voices.find(fn);
   let v = by(v => /Google/i.test(v.name) && v.lang === 'zh-TW')
        || by(v => /Google/i.test(v.name) && /^zh(-|_)/i.test(v.lang))
        || by(v => v.lang === 'zh-TW')
        || by(v => /^zh(-|_)/i.test(v.lang));
   return v || voices[0] || null;
 }
 function hardStopTTS() {
   try { _ttsToken++; } catch(_){}
   try { window.speechSynthesis.cancel(); } catch(_){}
 }
 function safeSpeak(text, delay = 0, onEnd = null) {
   if (!text) { return; }
   const prefs = _getTtsPrefs();
   if (!prefs.enabled) { if (typeof onEnd === 'function') setTimeout(onEnd, Math.max(0, delay)); return; }


   const speakNow = () => {
     const myToken = ++_ttsToken;
     const u = new SpeechSynthesisUtterance(text);
     u.onend = () => {
       try { window.speechSynthesis.cancel(); } catch(_){}
       if (typeof onEnd === 'function' && myToken === _ttsToken) setTimeout(onEnd, 200);
     };
     u.rate = prefs.rate; u.pitch = 1.0;
     const voice = pickPreferredVoice();
     if (voice) { u.voice = voice; if (voice.lang) u.lang = voice.lang; } else { u.lang = 'zh-TW'; }
     try { window.speechSynthesis.cancel(); } catch(_){}
     setTimeout(() => window.speechSynthesis.speak(u), delay);
   };
   if ((speechSynthesis.getVoices() || []).length > 0) speakNow();
   else {
     const handler = () => { speakNow(); speechSynthesis.removeEventListener('voiceschanged', handler); };
     speechSynthesis.addEventListener('voiceschanged', handler); speechSynthesis.getVoices();
   }
 }


 // ===== UI 工具 =====
 function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
 function renderProgress(){
   const bar = document.getElementById('progressBar');
   if(!bar) return; bar.innerHTML = '';
   for(let i=0;i<QUESTIONS.length;i++){
     const d = document.createElement('div');
     d.className = 'dot' + (i===idx ? ' active' : '');
     d.textContent = i + 1; bar.appendChild(d);
   }
 }
 function formatDuration(ms){
   const sec = Math.max(0, Math.round(ms/1000));
   const m = Math.floor(sec / 60);
   const s = sec % 60;
   return `${m} 分 ${s.toString().padStart(2,'0')} 秒`;
 }


 // ===== 選項顯示配色（沿用你既有的 map） =====
 const EMO_CH2EMOJI = {
   "快樂":"😀","開心":"😀","高興":"😀",
   "悲傷":"😢","難過":"😢","傷心":"😢",
   "憤怒":"😠","生氣":"😠",
   "驚訝":"😮",
   "恐懼":"😱","害怕":"😱",
   "厭惡":"🤢","討厭":"🤢","噁心":"🤢",
   "HAPPY":"😀","SAD":"😢","ANGRY":"😠","SURPRISE":"😮","FEAR":"😱","DISGUST":"🤢"
 };
 const EMOTION_COLOR_MAP = {
   ANGER:{bg:'#e53935'}, DISGUST:{bg:'#8BC34A'}, FEAR:{bg:'#B15BFF'},
   HAPPINESS:{bg:'#FDD835'}, SADNESS:{bg:'#1E88E5'}, SURPRISE:{bg:'#FB8C00'}
 };
 const EMO_TO_KEY = {
   "憤怒":"ANGER","生氣":"ANGER","ANGRY":"ANGER","ANGER":"ANGER",
   "厭惡":"DISGUST","討厭":"DISGUST","噁心":"DISGUST","DISGUST":"DISGUST",
   "恐懼":"FEAR","害怕":"FEAR","FEAR":"FEAR",
   "快樂":"HAPPINESS","開心":"HAPPINESS","高興":"HAPPINESS","HAPPY":"HAPPINESS","HAPPINESS":"HAPPINESS",
   "悲傷":"SADNESS","難過":"SADNESS","傷心":"SADNESS","SAD":"SADNESS","SADNESS":"SADNESS",
   "驚訝":"SURPRISE","SURPRISE":"SURPRISE"
 };
 function stripEmoji(s){ return String(s||"").replace(/[😀😢😠😮😱🤢⭕❌]/g,"").trim(); }
 function setOptionLabel(el, raw){
   const base = stripEmoji(raw);
   const emo  = EMO_CH2EMOJI[base] || (()=>{ for(const k in EMO_CH2EMOJI){ if(base.includes(k)) return EMO_CH2EMOJI[k]; } return ""; })();
   el.innerHTML = emo ? `<span class="emo-ic" style="font-size:1.6em;margin-right:.45em;vertical-align:-2px;text-shadow:0 1px 2px rgba(0,0,0,.18)">${emo}</span>${base}` : base;
 }
 function applyOptionStyle(el, raw){
   const base = stripEmoji(raw);
   const key  = EMO_TO_KEY[base] || (()=>{ for(const k in EMO_TO_KEY){ if(base.includes(k)) return EMO_TO_KEY[k]; } return null; })();
   const c = key ? EMOTION_COLOR_MAP[key] : null;
   el.style.background = (c ? c.bg : '#9e9e9e');
   el.style.color = '#fff';
   el.style.textShadow = '0 1px 2px rgba(0,0,0,.25)';
   el.style.border = 'none';
 }
 // ===== 題目回合 =====
 async function startPlay(){
   try{
     const stage = document.getElementById('stage');
     stage.innerHTML = '<div class="loading" id="loading">載入中……</div>';


     // 題目
     const r1 = await fetch(`${API_BASE}/api/set/${SET_ID}/questions?shuffle=1`, { credentials: 'same-origin' });
     const d1 = await r1.json().catch(()=> ({}));
     if(!r1.ok){ alert(d1?.error || `取得題目失敗 (HTTP ${r1.status})`); location.href = "{{ url_for('custom.page_list') }}"; return; }
     QUESTIONS = Array.isArray(d1) ? d1 : [];
     if(!QUESTIONS.length){ alert("此題庫目前沒有題目。"); location.href = "{{ url_for('custom.page_list') }}"; return; }


     // 建立回合
     const r2 = await fetch(`${API_BASE}/api/session/start`, {
       method:'POST', credentials: 'same-origin',
       headers:{'Content-Type':'application/json'},
       body: JSON.stringify({ set_id: SET_ID })
     });
     const d2 = await r2.json().catch(()=> ({}));
     if(!r2.ok || !d2.ok){ alert(d2?.error || `無法建立作答回合 (HTTP ${r2.status})`); location.href = "{{ url_for('custom.page_list') }}"; return; }
     cs_id = d2.cs_id;


     idx = 0; startTs = Date.now();
     renderProgress();


     // 開場語音：先報題數，再帶入第一題
     try { window.speechSynthesis.cancel(); } catch(_){}
      buildRound(QUESTIONS[idx], /*suppressLead*/false);
   }catch(e){
     alert("開始作答失敗：" + (e.message||e));
     location.href = "{{ url_for('custom.page_list') }}";
   }
 }


 // 顯示一題：支援語音先唸「第X題：{題目}」
 function buildRound(q, suppressLead=false){
   const stage = document.getElementById('stage');
   const loading = document.getElementById('loading');
   if(loading) loading.remove();


   renderProgress();


   const wrongs = EMOS.filter(e => e !== (q.c_answer || "").trim());
   const distractor = wrongs.length ? wrongs[Math.floor(Math.random() * wrongs.length)] : EMOS[Math.floor(Math.random() * EMOS.length)];
   const opts = shuffle([q.c_answer, distractor]);


   stage.innerHTML = `
     <div class="question">
       <img class="q-img" src="${q.c_media_url}" alt="題目圖"/>
       <div style="margin-top:10px;">${q.c_text || "這張圖片的人看起來是什麼情緒？"}</div>
       <div class="opts">
         ${opts.map(o => `<div class="opt" data-ans="${o}">${o}</div>`).join("")}
       </div>
     </div>
   `;


   stage.querySelectorAll('.opt').forEach(el=>{
     setOptionLabel(el, el.dataset.ans);
     applyOptionStyle(el, el.dataset.ans);
   });


   // 綁定送答：鎖住直到語音回饋結束
   stage.querySelectorAll('.opt').forEach(el=>{
     el.addEventListener('click', async ()=>{
       // 避免連點
       stage.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
       el.classList.add('selected');
       stage.querySelectorAll('.opt').forEach(x => x.style.pointerEvents = 'none');


       const choice = el.dataset.ans || "";
       let isCorrect = null;


       try{
         const resp = await fetch(`${API_BASE}/api/answer`, {
           method:'POST',
           credentials:'same-origin',
           headers:{'Content-Type':'application/json'},
           body: JSON.stringify({ cs_id, c_id: q.c_id, user_answer: choice })
         });
         const data = await resp.json().catch(()=> ({}));
         isCorrect = (resp.ok && data && (data.is_correct===1 || data.is_correct===true));
       }catch(e){ console.warn("送出單題答案失敗：", e); }


       // 硬體回饋
       if (isCorrect !== null) sendResultToDevice(!!isCorrect);


       // 立即鼓勵（視覺）
       const msg = isCorrect ? "太棒了！你答對了！" : "沒關係，再試一次喔！";
       const tip = document.createElement('div');
       tip.textContent = msg;
       tip.style.marginTop = '8px';
       tip.style.fontWeight = 'bold';
       tip.style.color = isCorrect ? 'green' : 'red';
       stage.querySelector('.question').appendChild(tip);


       // 語音鼓勵（唸完才前進）
       const feedbackSpeech = isCorrect
         ? "你好棒！答對了！"
         : `這題要選「${q.c_answer}」喔，下次一定可以！`;


       let nextQueued = false;
       const goNext = () => {
         if (nextQueued) return;
         nextQueued = true;
         waitingToAdvance = false;
         pendingNext = null;
         idx++;
         if(idx < QUESTIONS.length){
           renderProgress();
           buildRound(QUESTIONS[idx]);
         }else{
           finishSession();
         }
       };


       waitingToAdvance = true;
       pendingNext = goNext;
       safeSpeak(feedbackSpeech, 250, goNext);
     });
   });


   // 題目開場朗讀
   if (!suppressLead) {
     try { window.speechSynthesis.cancel(); } catch(_){}
     const text = q.c_text || "這張圖片的人看起來是什麼情緒？";
     safeSpeak(`第${idx + 1}題：${text}`, 80);
   }


   // 顯示題目時同步傳送給硬體
   window.dispatchEvent(new Event('play-next-question'));
 }


 async function finishSession(){
   if(!cs_id) return;
   const spentMs = startTs ? (Date.now() - startTs) : 0;


   document.getElementById('stage').classList.add('hidden');


   let correct = null, rate = null;
   try{
     const res = await fetch(`${API_BASE}/api/session/finish`, {
       method:'POST', credentials:'same-origin',
       headers:{'Content-Type':'application/json'},
       body: JSON.stringify({ cs_id })
     });
     const data = await res.json().catch(()=> ({}));
     if(res.ok && data){
       correct = data.correct;
       rate = (data.rate!=null ? Math.round(data.rate*100) : null);
     }
   }catch(e){ console.warn("結束回合呼叫錯誤：", e); }


   const fb = document.getElementById('finishBox');
   const ft = document.getElementById('finishTitle');
   const fs = document.getElementById('finishSummary');
   const btn = document.getElementById('btnHome');
   ft.textContent = '答題結束，感謝你完成練習！';
   const lines = [
     `總題數：${QUESTIONS.length} 題`,
     `作答時間：${formatDuration(spentMs)}`
   ];
   if (correct!=null) lines.push(`答對：${correct} 題`);
   if (rate!=null)    lines.push(`正確率：${rate}%`);
   fs.innerHTML = lines.join('<br>');


   fb.style.display = 'block';
   const mask = document.getElementById('finishMask');
   if (mask) mask.style.display = 'block';
   document.body.style.overflow = 'hidden';
   window.scrollTo({ top: 0, left: 0, behavior: 'auto' });




   // 倒數返回
   let sec = 6;
   const listUrl = `{{ url_for('custom.page_list') }}`;
   btn.textContent = `返回清單 (${sec}s)`;
   const timer = setInterval(()=>{
     sec--;
     if(sec<=0){
       clearInterval(timer);
       document.body.style.overflow = '';
       if (mask) mask.style.display = 'none';
       fb.style.display = 'none';
       location.href = listUrl;
     }else{
       btn.textContent = `返回清單 (${sec}s)`;
     }
   }, 1000);


   // 完成自動斷線（硬體）
   cleanupSerial();
 }


 // ===== 提前結束：顯示/隱藏/執行 =====
 const exitModal = document.getElementById('exitModal');
 const btnExit = document.getElementById('btnExit');
 const exitYes = document.getElementById('exitYes');
 const exitNo  = document.getElementById('exitNo');
 btnExit.addEventListener('click', ()=> { exitModal.style.display='flex'; });
 exitNo.addEventListener('click',  ()=> { exitModal.style.display='none'; });
 exitYes.addEventListener('click', async ()=>{
   try { await fetch(`${API_BASE}/api/session/finish`, {
     method:'POST', credentials:'same-origin',
     headers:{'Content-Type':'application/json'},
     body: JSON.stringify({ cs_id })
   }); } catch(_){}
   hardStopTTS();
   cleanupSerial();
   location.href = "{{ url_for('custom.page_list') }}";
 });


 // ===== 分頁可見度：切走就停語音；回來且在等待就直接前進 =====
 document.addEventListener('visibilitychange', () => {
   if (document.hidden) { hardStopTTS(); return; }
   if (!document.hidden && waitingToAdvance && typeof pendingNext === 'function') {
     const fn = pendingNext;
     waitingToAdvance = false; pendingNext = null; fn();
   }
 });
 window.addEventListener('pagehide', hardStopTTS, { capture:true });
 window.addEventListener('beforeunload', hardStopTTS);


 // ===== 啟動 =====
 window.addEventListener('DOMContentLoaded', () => { startPlay(); });
 </script>
  <!-- ===== 新增：Web Serial 串接（與 Quiz 對齊），不影響既有流程 ===== -->
 <script>
   // 以 DOM 觀察的方式「非侵入式」掛勾 .opt 按鈕，避免動到你既有的資料流程
   let serialConnected=false, serialPort=null, serialReader=null, serialWriter=null, serialDecoder=null;
   let currentRid=null;
   const hwBtn = document.getElementById('hwBtn');


   // 與 Quiz 相同的情緒中英映射（色彩由裝置端決定）
   const EMO_CH2EN = {
     "快樂":"HAPPY","開心":"HAPPY","高興":"HAPPY",
     "悲傷":"SAD","難過":"SAD","傷心":"SAD",
     "憤怒":"ANGRY","生氣":"ANGRY",
     "驚訝":"SURPRISE",
     "恐懼":"FEAR","害怕":"FEAR",
     "厭惡":"DISGUST","討厭":"DISGUST","噁心":"DISGUST"
   };
   function stripEmoji(s){ return String(s||"").replace(/[😀😢😠😮😱🤢⭕❌]/g,"").trim(); }
   function genRID(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }


   function _reflectHW(){
     if(!hwBtn) return;
     if(serialConnected){ hwBtn.textContent='✅ 硬體已連線'; hwBtn.classList.add('is-online'); }
     else{ hwBtn.textContent='🔌 連接硬體'; hwBtn.classList.remove('is-online'); }
   }


   async function _openPort(port){
     await port.open({ baudRate:115200 });
     serialDecoder=new TextDecoderStream(); port.readable.pipeTo(serialDecoder.writable);
     serialReader=serialDecoder.readable.getReader();
     serialWriter=port.writable.getWriter();
     serialPort=port; serialConnected=true; _reflectHW();
     navigator.serial.addEventListener('disconnect', cleanupSerial);
     readLoop();
     // 連上後馬上同步當前題的兩個選項（若已渲染）
     sendCurrentOptionsToDevice();
   }
   async function autoConnectIfAuthorized(){
     if(!('serial' in navigator)) return;
     try{
       const pre=await navigator.serial.getPorts();
       if(pre.length){ await _openPort(pre[0]); }
     }catch(e){ console.warn('[Play] auto-open failed',e); cleanupSerial(); }
   }
   async function connectSerial(){
     if(!('serial' in navigator)){ alert('此瀏覽器不支援 Web Serial，請使用 Chrome/Edge。'); return; }
     try{
       const pre=await navigator.serial.getPorts();
       const port=pre[0] || await navigator.serial.requestPort();
       await _openPort(port);
     }catch(e){ console.error(e); alert('連線失敗：'+e); }
   }
       // 補：把作答結果回送給裝置（OK/NG），附上 currentRid 方便裝置側配對
   function sendResultToDevice(isCorrect){
     if(!serialConnected || !serialWriter) return;
     const ans = isCorrect ? 'OK' : 'NG';
     // 與問答同一輪的 rid
     const rid = currentRid || '';
     writeLine(`R,${rid},${ans}`);
   }
   function cleanupSerial(){
     serialConnected=false; _reflectHW();
     try{ serialReader?.releaseLock(); }catch(_){}
     try{ serialWriter?.releaseLock(); }catch(_){}
     serialReader=serialWriter=serialDecoder=null; serialPort=null; currentRid=null;
   }
   async function writeLine(line){
     if(!serialConnected || !serialWriter) return;
     const data=new TextEncoder().encode(line.endsWith('\n')?line:line+'\n');
     try{ await serialWriter.write(data); }catch(e){ console.warn('[Play] write err',e); }
   }
   async function readLoop(){
     let buffer=''; try{
       while(serialConnected && serialReader){
         const {value,done}=await serialReader.read();
         if(done) break;
         if(value){
           buffer+=value; let idx;
           while((idx=buffer.indexOf('\n'))>=0){
             const line=buffer.slice(0,idx).trim(); buffer=buffer.slice(idx+1);
             if(line) handleSerialLine(line);
           }
         }
       }
     }catch(e){ console.warn('[Play] read err',e); }
     cleanupSerial();
   }
   function handleSerialLine(line){
     // 期待格式：ANS,<rid>,A|B
     const parts = line.split(',').map(s=>s.trim());
     if(parts[0] === 'ANS' && parts.length === 3){
       const rid = parts[1], ab = parts[2];
       if(rid && rid === currentRid){
         const btns = getTwoOptionButtons();
         const idx = (ab==='A')?0:1;
         if(btns[idx]) btns[idx].click();   // 直接觸發你原本的送答邏輯
       }
     }
   }


   // —— 抓出畫面上的兩顆 .opt 按鈕（不要求固定 id），維持現有 HTML 結構 —— //
   function getTwoOptionButtons(){
     const list = Array.from(document.querySelectorAll('.opts .opt, .options .option-btn')).filter(el=>el.offsetParent!==null);
     // 盡量取前兩顆可見按鈕
     return [list[0] || null, list[1] || null];
   }
   function readLabel(btn){
     if(!btn) return '';
     // 優先讀純文字（去掉裝飾 emoji / 圈叉）
     return stripEmoji(btn.textContent || btn.innerText || '').trim();
   }
   function asToken(labelRaw){
     const t = stripEmoji(labelRaw);
     // 情境正/誤直接回傳中文；情緒轉成英文 token（與 Quiz 一致）
     if(t === '正確' || t === '錯誤') return t;
     return EMO_CH2EN[t] || t;
   }


   function sendCurrentOptionsToDevice(){
     if(!serialConnected) return;
     const [a,b] = getTwoOptionButtons();
     if(!a || !b) return;
     const la = readLabel(a), lb = readLabel(b);
     if(!la || !lb) return;
     currentRid = genRID();
     const A = asToken(la), B = asToken(lb);
     // 與 Quiz 相同協定：Q,<rid>,<A>,<B>
     writeLine(`Q,${currentRid},${A},${B}`);
   }


   // —— 監看畫面：當題目或選項重新渲染時，自動同步到裝置 —— //
   const stage = document.getElementById('stage') || document.body;
   const mo = new MutationObserver(()=>{
     // 每次內容改變，稍等 50ms 讓 DOM 就位
     setTimeout(sendCurrentOptionsToDevice, 50);
   });
   mo.observe(stage, { childList:true, subtree:true });


   // 綁定按鈕與初始自動連
   hwBtn?.addEventListener('click', connectSerial);
   window.addEventListener('DOMContentLoaded', ()=>{ _reflectHW(); autoConnectIfAuthorized(); });


   // 額外：若你的 Play 程式在切題時有事件，可手動呼叫 sendCurrentOptionsToDevice()
   window.addEventListener('play-next-question', sendCurrentOptionsToDevice);
 </script>
