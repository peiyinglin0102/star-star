  <!-- 全站倒數提醒容器 -->

  <script type="module">
    // 全站單例：window.SerialHW
    // 設計：授權一次 → 後續任何頁以 getPorts() 自動取回同一裝置並開啟
    // 事件：window 上派發 'hw-line' 事件（有資料）、'hw-status'（連線/斷線）
    let _port=null,_writer=null,_reader=null,_decoder=null,_connected=false;

    function statusBroadcast(){
      try{ window.dispatchEvent(new CustomEvent('hw-status',{detail:{connected:_connected}})); }catch(_){}
      try{ localStorage.setItem('serial.connected', _connected?'1':'0'); }catch(_){}
    }
    function uiReflect(){
      const btn=document.getElementById('btnHW');
      if(!btn) return;
      if(_connected){ btn.textContent='✅ 硬體已連線'; btn.classList.add('is-online'); }
      else{ btn.textContent='🔌 連接硬體'; btn.classList.remove('is-online'); }
    }
    async function _openSelectedPort(){
      await _port.open({ baudRate:115200 });
      _decoder=new TextDecoderStream(); _port.readable.pipeTo(_decoder.writable);
      _reader=_decoder.readable.getReader(); _writer=_port.writable.getWriter();
      _connected=true; uiReflect(); statusBroadcast(); _readLoop();
      navigator.serial.addEventListener('disconnect', _cleanupOnce);
    }
    async function _readLoop(){
      let buf=''; const onLine=(line)=>{ try{ window.dispatchEvent(new CustomEvent('hw-line',{detail:line})) }catch(_){} };
      try{
        while(_connected && _reader){
          const {value,done}=await _reader.read(); if(done) break;
          if(value){ buf+=value; let i; while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(line) onLine(line); } }
        }
      }catch(e){ console.warn('[HW] read error',e); }
      _cleanupOnce();
    }
    function _cleanupOnce(){
      if(!_connected) return;
      _connected=false; uiReflect(); statusBroadcast();
      try{ _reader?.releaseLock(); }catch(_){}
      try{ _writer?.releaseLock(); }catch(_){}
      _reader=_writer=_decoder=null; _port=null;
    }

    async function connect(){
      if(!('serial' in navigator)){ alert('此瀏覽器不支援 Web Serial，請使用 Chrome/Edge。'); return; }
      try{
        const pre=await navigator.serial.getPorts();
        _port = pre[0] || await navigator.serial.requestPort();
        await _openSelectedPort();
      }catch(e){ console.error(e); alert('連線失敗：'+e); }
    }
    async function tryReconnect(){
      if(!('serial' in navigator)) return;
      try{
        const pre=await navigator.serial.getPorts();
        if(pre.length){ _port=pre[0]; await _openSelectedPort(); }
        else{ uiReflect(); statusBroadcast(); }
      }catch(e){ console.warn('[HW] auto-open failed',e); _cleanupOnce(); }
    }
    async function write(line){
      if(!_connected || !_writer) return;
      const data=new TextEncoder().encode(line.endsWith('\n')?line:line+'\n');
      try{ await _writer.write(data); }catch(e){ console.warn('[HW] write failed',e); }
    }
      // 主動中斷
    function disconnect(){
      _cleanupOnce(); // 關閉 reader/writer/port，更新 UI 與狀態事件
      alert('已中斷連線');
    }

    // 重新連線（先斷→再嘗試打開相同或已授權裝置；找不到就請求新裝置）
    async function reconnect(){
      const wasConnected = _connected;
      _cleanupOnce();
      try{
        const pre = await navigator.serial.getPorts();
        _port = pre[0] || null;
        if(_port){
          await _openSelectedPort();
          alert('已重新連線');
        }else{
          // 沒有已授權裝置 → 要求使用者選擇
          await connect();
          if(!_connected) throw new Error('reconnect failed');
        }
      }catch(e){
        console.warn('[HW] reconnect failed', e);
        if(wasConnected) alert('重新連線失敗，請檢查線材/電源後再試');
      }
    }

    // 已連線時點按按鈕：給使用者選「中斷」或「重新連線」
    async function manage(){
      // 先詢問要不要中斷；取消就當作要改成「重新連線」
      const ok = confirm('要「中斷連線」嗎？\n（按「取消」則改為「重新連線」）');
      if(ok) disconnect();
      else await reconnect();
    }

    window.SerialHW = Object.freeze({
      get connected(){ return _connected; },
      connect, tryReconnect, write,
      disconnect,    // 新增
      reconnect      // 新增
    });

    // 首頁上的主連線按鈕
        document.getElementById('btnHW')?.addEventListener('click', ()=>{
      if(_connected) manage();
      else connect();
    });

    // 進頁自動嘗試打開已授權裝置
    window.addEventListener('DOMContentLoaded', ()=>{ tryReconnect(); uiReflect(); });

    // 讓手機選單也能操作（如需）
    document.getElementById('mobileOpenHW')?.addEventListener('click', connect);
  </script>

  <!-- 系統設定：開關、語速同步、時間控管（原邏輯保留） -->
  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const openBtn  = $('#openSettings');
    const modal    = $('#sysSettingsModal');
    const closeBtn = $('#sysSettingsClose');

    const inputH   = $('#timeHours');
    const inputM   = $('#timeMinutes');
    const btnStart = $('#timerStart');
    const btnStop  = $('#timerStop');
    const remainEl = $('#timeRemain');

    const rate     = $('#ttsRate');
    const rateLbl  = $('#ttsRateLabel');
    const btnTest  = $('#ttsTest');
    const enabled  = $('#ttsEnabled');

    const logoutUrl = document.body.getAttribute('data-logout-url') || '/logout';

    const openModal  = () => modal.setAttribute('aria-hidden','false');
    const closeModal = () => modal.setAttribute('aria-hidden','true');
    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    const initRate = () => {
      let saved = parseFloat(localStorage.getItem('tts.rate'));
      if (Number.isNaN(saved)) saved = 1.0;
      saved = Math.min(2, Math.max(0.5, saved));
      rate.value = saved.toFixed(2);
      rateLbl.textContent = saved.toFixed(2) + '×';
      window.StarSpeech && (window.StarSpeech.rate = saved);
      localStorage.setItem('tts.rate', saved.toFixed(2));
    };
    const initEnabled = () => {
      const on = (localStorage.getItem('tts.enabled') ?? '1') !== '0';
      enabled.checked = on;
      window.StarSpeech && (window.StarSpeech.enabled = on);
      localStorage.setItem('tts.enabled', on ? '1' : '0');
    };
    rate.addEventListener('input', () => {
      let v = parseFloat(rate.value);
      if (Number.isNaN(v)) v = 1.0;
      v = Math.min(2, Math.max(0.5, v));
      rate.value = v.toFixed(2);
      rateLbl.textContent = v.toFixed(2) + '×';
      window.StarSpeech && (window.StarSpeech.rate = v);
      localStorage.setItem('tts.rate', v.toFixed(2));
    });
    enabled.addEventListener('change', () => {
      const on = !!enabled.checked;
      window.StarSpeech && (window.StarSpeech.enabled = on);
      localStorage.setItem('tts.enabled', on ? '1' : '0');
    });
    btnTest.addEventListener('click', () => {
      window.StarSpeech?.speak('這是速度測試。現在的語速是 ' + window.StarSpeech.rate.toFixed(2) + ' 倍。');
    });
    initRate(); initEnabled();

    const fmt = (ms) => {
      if (ms <= 0) return '00:00';
      const s = Math.floor(ms/1000), m = Math.floor(s/60);
      return String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    };
    const refreshRemain = () => {
      const { active, left } = window.ParentTimer?.status() || {active:false,left:0};
      remainEl.textContent = active ? fmt(left) : '未開始';
      btnStart.disabled = active; btnStop.disabled  = !active;
      if (active && left <= 0) window.location.href = logoutUrl;
    };
    btnStart.addEventListener('click', () => {
      const h = Math.max(0, parseInt(inputH.value || '0', 10));
      const m = Math.max(0, parseInt(inputM.value || '0', 10));
      const ms = (h*60 + m) * 60 * 1000;
      if (ms > 0) ParentTimer.start(ms);
    });
    btnStop.addEventListener('click',  () => ParentTimer.stop());
    setInterval(refreshRemain, 500);
    window.addEventListener('storage', (e) => {
      if (e.key === 'timer.active' || e.key === 'timer.endAt') refreshRemain();
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshRemain(); });
    refreshRemain();
  })();
  </script>

  <script>
    function __uiStartTimer(){
      var h = parseInt(document.getElementById('timeHours')?.value || '0', 10) || 0;
      var m = parseInt(document.getElementById('timeMinutes')?.value || '0', 10) || 0;
      var ms = (h * 60 + m) * 60000;
      if (ms <= 0) { alert('請輸入大於 0 的時間'); return; }
      if (window.ParentTimer && typeof window.ParentTimer.start === 'function') {
        window.ParentTimer.start(ms);
      } else {
        console.error('ParentTimer 尚未就緒'); alert('計時器未就緒，請重新整理頁面');
      }
    }
    function __uiStopTimer(){
      if (window.ParentTimer && typeof window.ParentTimer.stop === 'function') {
        window.ParentTimer.stop();
      }
    }
  </script>

  <!-- 手機：漢堡選單控制（桌機不影響） -->
  <script>
    (function(){
      const btn = document.getElementById('mobileMenuBtn');
      const menu = document.getElementById('mobileMenu');
      const backdrop = document.getElementById('mobileMenuBackdrop');
      const logoutUrl = document.body.getAttribute('data-logout-url') || '/logout';
      const openSettingsBtn = document.getElementById('openSettings');
      const mobileOpenSettings = document.getElementById('mobileOpenSettings');
      const mobileLogout = document.getElementById('mobileLogout');

      // 媒體查詢：只在手機寬度顯示漢堡鈕；離開手機寬度時自動關閉選單
      const mq = window.matchMedia('(max-width: 768px)');
      function syncBurger(){
        const show = mq.matches;
        btn.style.display = show ? 'inline-flex' : 'none';
        if(!show){
          menu.classList.remove('active');
          backdrop.classList.remove('active');
          btn.setAttribute('aria-expanded','false');
          menu.setAttribute('aria-hidden','true');
        }
      }
      syncBurger();
      mq.addEventListener('change', syncBurger);

      function toggleMenu(force){
        const willOpen = (force === true) || (force !== false && !menu.classList.contains('active'));
        menu.classList.toggle('active', willOpen);
        backdrop.classList.toggle('active', willOpen);
        btn.setAttribute('aria-expanded', String(willOpen));
        menu.setAttribute('aria-hidden', String(!willOpen));
      }
      btn.addEventListener('click', ()=>toggleMenu());
      backdrop.addEventListener('click', ()=>toggleMenu(false));

      // 手機：開啟系統設定（呼叫既有節點的 click）
      mobileOpenSettings.addEventListener('click', ()=>{
        toggleMenu(false);
        openSettingsBtn?.click();
      });

      // 手機：登出
      mobileLogout.addEventListener('click', ()=>{
        toggleMenu(false);
        location.href = logoutUrl;
      });

      // Esc 關閉
      document.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape' && menu.classList.contains('active')) toggleMenu(false);
      });
    })();
  </script>
