<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <title>星星關卡答題</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="{{ url_for('static', filename='exit.png') }}">
        <link rel="apple-touch-icon"
              href="{{ url_for('static', filename='12.png') }}">
        <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      margin: 0;
      background: #fff;
      background-image:url("{{ url_for('static', filename='12.png') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
      text-align: center;
      padding-top: 76px;
    }

    .topbar {
      display: none !important;
    }

    body {
      padding-top: 24px;
    }

    /* 原本有 topbar 的上邊距，縮小一點讓畫面更集中 */




    /* 一排置中：左=返回，中=max-content(題號)，右=連接硬體 */
    .progress-row {
      display: grid;
      grid-template-columns: 1fr max-content 1fr;
      /* 左右平均分配空間 */
      align-items: center;
      justify-items: center;
      /* 每個格子內容都置中 */
      column-gap: 12px;
      margin: 8px auto 12px;
      width: min(92vw, 980px);
      position: relative;
    }








    /* 題號列（維持原本圓點樣式；這裡只做間距與置中） */
    .progress {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0;
      margin: 0;
    }




    /* 返回按鈕尺寸微調，貼近題號列左側 */
    .progress-row .exit-icon {
      border: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
      cursor: pointer;




    }

    .progress-row .exit-icon img {
      transition: transform .2s;
    }

    .progress-row .exit-icon img:hover {
      transform: scale(1.1);
    }




    /* 連接硬體貼在題號列右側 */
    .progress-row .hw-btn {
      justify-self: start;
      /* ← 保留這個 */
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 15px;
      cursor: pointer;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .20);
      white-space: nowrap;
    }




    .hw-btn.connected {
      background: #d2f8d2;
    }




    /* 讓整排真的置中 & 左右貼齊 */
    .progress-row {
      display: grid;
      grid-template-columns: 1fr max-content 1fr;
      align-items: center;
      justify-items: center;
      column-gap: 12px;
      margin: 8px auto 12px;
      width: min(92vw, 980px);
    }

    .progress-row .exit-icon {
      justify-self: end;
    }

    .progress-row .hw-btn {
      justify-self: start;
    }




    /* 返回鍵加大（外觀依你主題，這裡只放大不加外框） */
    /* 位置仍在題號列最左邊 */
    .progress-row .exit-icon {
      justify-self: end;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      cursor: pointer;
    }




    /* 圖片維持原本 40x40，只有 hover 放大 */
    .progress-row .exit-icon img {
      width: 60px;
      height: 60px;
      transition: transform .2s;
    }

    .progress-row .exit-icon img:hover {
      transform: scale(1.1);
    }




    @media (max-width:768px) {
      .progress-row .exit-icon img {
        width: 38px;
        height: 38px;
      }
    }

    /* 讓整個題目區置中並限制寬度 */
    .progress {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px auto 12px;
      flex-wrap: wrap;
      max-width: 1024px;
      padding: 0 16px;
    }

    .dot {
      width: 44px;
      height: 44px;
      line-height: 44px;
      font-size: 20px;
      border-radius: 50%;
      background: #eee;
      color: #333;
    }

    .dot.active {
      background: #ffe600;
      font-weight: bold;
    }




    .question-box {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 清除圖片與影片的灰底/濾鏡/外框，只保留圓角與陰影 */
    .question-box img,
    #questionVideo {
      background: transparent !important;
      border: none !important;
      outline: none !important;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
      max-width: 90%;
      /* 避免太寬超出容器 */
      max-height: min(55vh, 600px);
      transform-origin: center center;
      width: var(--media-w, min(64vw, 500px));
      max-height: var(--media-h, min(48vh, 700px));
      object-fit: cover;
      /* 填滿但允許裁切 */
      object-position: center top;
      /* 從上方對齊，必要時裁掉下半部 */
    }

    /* === 若圖片原始寬度太小（低於容器 70%） → 改成 contain，不裁切 === */
    .question-box img.too-small,
    #questionVideo.too-small {
      object-fit: contain;
      transform: scale(1.05);
      /* 稍微放大一點避免太小 */
    }

    .question-box h2 {
      max-width: 900px;
      margin: 20px auto 16px;
      /* ↑ 原本 8px → 改 20px，往下移一點 */
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.4;
    }




    .options {
      display: flex;
      justify-content: center;
      gap: clamp(16px, 4vw, 40px);
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .option-btn {
      padding: clamp(14px, 2.5vw, 20px) clamp(24px, 5vw, 40px);
      font-size: clamp(18px, 2.2vw, 24px);
      color: #fff;
      background: #ff6666;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      min-width: 150px;
      transition: transform .08s ease, opacity .2s ease;
    }

    .option-btn:active {
      transform: scale(.96)
    }

    .option-btn[disabled] {
      opacity: .6;
      cursor: not-allowed
    }




    .feedback {
      margin-top: 18px;
      font-weight: bold;
      font-size: 20px;
      color: #444;
      min-height: 1.2em;
    }




    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: #fff;
      padding: 30px 40px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    }

    .modal-content button {
      margin: 10px 15px;
      font-size: 20px;
      padding: 12px 24px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    .btn-yes {
      background: #ffe600
    }

    .btn-no {
      background: #f66;
      color: #fff
    }

    .finish-box {

      margin: 18px auto;
      padding: 20px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);

    @media (max-height:740px) {

    @media (max-width:768px) {

    /* 情境題用的白色圈叉（已經有了 opt-ic） */
    /* 情緒題用的表情圖示（放大） */

    /* 手機稍微縮小一點避免擠壓 */
    @media (max-width:768px) {
      .option-btn .emo-ic {
        font-size: 1.6em;
      }
    }

    .ttsUnlock-title {
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.4;
      text-align: center;

    /* ====== Mobile only (≤768px) ====== */
    @media (max-width:768px) {




      /* 讓背景真的鋪滿整個畫面，避免底部留白 */
      html,
      body {
        min-height: 80vh !important;
      }

      body {

        background-position: center top !important;

      }




      /* 進度列區塊更靠上、左右各 48px 容納返回/硬體 */
      .progress-row {
        width: 92vw !important;
        margin-top: 40px !important;
        margin: 0 auto 6px !important;
        grid-template-columns: 48px 1fr 48px !important;
        column-gap: 10px !important;
        align-items: center !important;
        justify-items: center !important;
      }




      /* 題號：改 5×2 的網格（五個一排） */
      .progress {
        display: grid !important;
        grid-template-columns: repeat(5, 40px) !important;
        /* 五個一排 */
        grid-auto-rows: 40px;
        justify-content: center;
        gap: 10px !important;
        margin: 4px 0 2px !important;
        padding: 0 !important;
      }

      .dot {
        width: 40px;
        height: 40px;
        line-height: 40px;
        font-size: 20px;
        border-radius: 50%;
      }




      /* 返回按鈕大一點 */
      .progress-row .exit-icon {
        padding: 0 !important;
        background: transparent !important;
        border: none !important;
      }

      .progress-row .exit-icon img {
        width: 44px;
        height: 44px;
      }




      /* 連接硬體：固定在最上方右側 */
      #hwConnectBtn.hw-btn {
        position: fixed !important;
        top: 8px;
        right: 12px;
        z-index: 2000;
        padding: 6px 10px !important;
        font-size: 14px !important;
        border-radius: 12px !important;
        white-space: nowrap;
      }




      /* 題目區：更上方、內距縮小 */
      .question-box {
        max-width: 96vw !important;
        margin-top: -2px !important;
        padding: 6px 10px 10px !important;
      }




      /* 圖片/影片：再小一點，避免把按鈕擠到下方；高度也限縮 */
      .question-box img,
      #questionVideo {
        width: min(72vw, 320px) !important;
        /* ← 原本更寬，改更精簡 */
        max-height: 34vh !important;
        margin-top: 20px !important;
        /* 讓選項能進首屏 */
        object-fit: cover !important;
        object-position: center top !important;
        border-radius: 10px;
      }




      /* 題目文字：間距與字級微調 */
      .question-box h2 {
        margin: 10px auto 8px !important;
        font-size: clamp(18px, 4.6vw, 22px) !important;
        margin-top: 20px !important;
        line-height: 1.4 !important;
      }




      /* 選項按鈕：只縮尺寸與間距（顏色不動） */
      .options {
        gap: 12px !important;
        margin-top: 20px !important;
        justify-content: center !important;
        flex-wrap: wrap !important;
      }

      .option-btn {
        min-width: 140px !important;
        padding: 12px 18px !important;
        font-size: 18px !important;
        border-radius: 14px !important;
      }




      /* 完成視窗（保底） */
      .finish-box {
        width: 92vw !important;
        margin: 10px auto !important;
        padding: 16px !important;
      }
    }






    /* === 圖片/影片 置中裁切；維持原尺寸，不再上方對齊 === */
    .question-box img,
    #questionVideo {
      object-position: center center !important;
      /* 原本 center top → 改 center */
    }


    /* 手機也一樣置中 */
    @media (max-width:768px) {

      .question-box img,
      #questionVideo {
        object-position: center center !important;
      }
    }

    /* === 與題庫縮圖一致：置中裁切，大小不變 === */
    .question-box img,
    #questionVideo {
      object-fit: cover !important;
      /* 填滿容器，必要時裁切 */
      object-position: center center !important;
      /* 置中對齊，不再「上方對齊」 */
    }

    /* 強制統一行為，即使有 .too-small 也維持置中裁切 */
    .question-box img.too-small,
    #questionVideo.too-small {
      object-fit: cover !important;
      object-position: center center !important;
    }

    /* ===== 題目載入進度條 ===== */
    #loadingBarWrapper {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      z-index: 99998;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
    }

    #loadingText {
      font-size: 20px;
      margin-bottom: 16px;
      font-weight: 600;
      color: #333;
    }

    #loadingBarOuter {
      width: 60%;
      max-width: 420px;
      height: 14px;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
    }

    #loadingBarInner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffe600, #ffb400);
      transition: width .2s ease;
    }
        </style>
    </head>
    <body data-logout-url="{{ url_for("auth.logout") }}">
        <!-- ===== 題目載入進度條 ===== -->
        <div id="loadingBarWrapper">
            <div id="loadingText">進ㄐㄧㄣˋ 入ㄖㄨˋ 中ㄓㄨㄥ 呦一ㄡ ~</div>
            <div id="loadingBarOuter">
                <div id="loadingBarInner"></div>
            </div>
        </div>
        <!-- 其餘內容/所有 inline script 再往下 -->
        <script src="{{ url_for('static', filename='js/parent_timer.js') }}?v=20251025-6"></script>
        <!-- 行動裝置 TTS 解鎖層（首次點擊後自動隱藏） -->
        <div id="ttsUnlock"
             style="position:fixed;
                    inset:0;
                    display:none;
                    align-items:center;

                    background:rgba(255,255,255,.85);

                    backdrop-filter:blur(2px);
                    font-size:20px;
                    color:#333">
            <div style="text-align:center">
                <div class="ttsUnlock-title">
                    觸ㄔㄨˋ 碰ㄆㄥˋ 螢一ㄥˊ 幕ㄇㄨˋ 後ㄏㄡˋ
                    <br>
                    開ㄎㄞ 始ㄕˇ 作ㄗㄨㄛˋ 答ㄉㄚˊ
                </div>
                <div style="font-size:14px;color:#666">（開啟語音播放）</div>
            </div>
        </div>
        <!-- 新的一排：左=返回，中=題號(置中)，右=連接硬體 -->
        <div class="progress-row">

        <!-- 全站倒數提醒容器（60s / 30s / 5s 用） -->
        <div id="sysWarnToast" class="sysset-toast" hidden></div>
        <script data-build="quiz-build" data-ts="{{ (namespace or 'NA') }}-{{  (request.args.get('s_type') or '圖片') }}-{{  (range(1)|list|length)  }}">
      /* ===========================
       Quiz.js  (Unified Build + Round Preload)
       — 在建立回合後預先把整回合圖片/影片載入（含 A～E 修正）
       =========================== */

      /* ===== URL 與常數 ===== */
      const params = new URLSearchParams(location.search);
      const sType = params.get('s_type') || '圖片';
      const API = '/quiz';
      const ORIGIN = window.location.origin;

      console.log('[Quiz build] API=', API, 'sType=', sType, 'now=', new Date().toISOString());

      /* ===== 題目狀態 ===== */
      let questions = [];
      let _ttsToken = 0;
      let current = 0;
      let score = 0;
      let endCalled = false;
      let submitLocked = false;
      let finishCountdownTimer = null;
      let finishCountdownSeconds = 6;
      let waitingToAdvance = false;
      let pendingNext = null;
      let pausedByHide = false;
      let firstRenderDone = false;
      let loadToken = 0;

      /* ===== Web Serial 全域 ===== */
      let currentRid = null;

      /* ===== DOM ===== */
      const connectBtn = document.getElementById('hwConnectBtn');
      const progressBar = document.getElementById('progressBar');
      const questionImage = document.getElementById('questionImage');
      const questionVideo = document.getElementById('questionVideo');
      const questionText = document.getElementById('questionText');
      const optionButtons = [document.getElementById('opt0'), document.getElementById('opt1')];
      const feedbackEl = document.getElementById('feedback');
      const exitModal = document.getElementById('exitModal');
      const finishBox = document.getElementById('finishBox');
      const finishTitle = document.getElementById('finishTitle');
      const finishSummary = document.getElementById('finishSummary');
      const btnHome = document.getElementById('btnHome');

      const HOME_URL = "{{ home_url | default(url_for('auth.index')) }}";
      let lastKnownHome = HOME_URL;

      /* ===== ParentTimer ===== */
      window.DeferLogout = true;
      const LOGOUT_URL = document.body?.getAttribute('data-logout-url') || '/auth/logout';
      let hadTimerThisSession = false;
      (function initTimerSeenFlag() {
        try {
          const active = localStorage.getItem('timer.active') === '1';
          const endAt = Number(localStorage.getItem('timer.endAt') || '0');
          if (active || endAt > Date.now()) hadTimerThisSession = true;
          if (!hadTimerThisSession && localStorage.getItem('timer.logoutPending') === '1') {
            localStorage.removeItem('timer.logoutPending');
          }
        } catch (_) { }
      })();
      window.addEventListener('storage', (e) => {
        if (!e.key) return;
        if (e.key === 'timer.active' || e.key === 'timer.endAt' || e.key === 'timer.ping') {
          try {
            const active = localStorage.getItem('timer.active') === '1';
            const endAt = Number(localStorage.getItem('timer.endAt') || '0');
            if (active || endAt > Date.now()) hadTimerThisSession = true;
          } catch (_) { }
        }
      });
      function shouldLogoutAfterRound() {
        return hadTimerThisSession && localStorage.getItem('timer.logoutPending') === '1';
      }

      /* ===== fetch 防呆 ===== */
      (function guardFetchOnce() {
        const _rawFetch = window.fetch.bind(window);
        window.fetch = function (url, opts, ...rest) {
          try {

        const isTF = (q.options || []).every(x => TF_SET.has(stripEmoji(x)));
        const mode = isTF ? 'tf' : 'emotion';
        setOptionLabel(optionButtons[0], q.options?.[0] ?? '', mode);
        setOptionLabel(optionButtons[1], q.options?.[1] ?? '', mode);
        applyOptionStyle(optionButtons[0], q.options?.[0] ?? '', mode);
        applyOptionStyle(optionButtons[1], q.options?.[1] ?? '', mode);

        document.querySelector('.options').style.display = 'flex';
        feedbackEl.style.display = 'block';
        feedbackEl.textContent = '';

        if (!IS_MOBILE) { try { window.speechSynthesis.cancel(); } catch (_) { } }
        setTimeout(() => safeSpeak(`第${current + 1}題。${text}`), 80);

        setOptionsEnabled(true);
        renderProgress();
        submitLocked = false;

        setTimeout(sendCurrentOptionsToDevice, 80);
      }

      /* ===== 完成盒/送答/退出（沿用原本） ===== */
      function showFinishBox() {
        const needLogout = shouldLogoutAfterRound();
        finishSummary.textContent = `總共答對 ${score} / ${questions.length} 題`;
        finishTitle.textContent = needLogout ? '答題結束，將自動登出' : '答題結束，感謝你完成練習！';
        finishBox.style.display = 'block';
        finishCountdownSeconds = 6;
        btnHome.textContent = needLogout ? `登出 (${finishCountdownSeconds}s)` : `回到首頁 (${finishCountdownSeconds}s)`;
        if (finishCountdownTimer) { clearInterval(finishCountdownTimer); finishCountdownTimer = null; }
        finishCountdownTimer = setInterval(() => {
          finishCountdownSeconds -= 1;
          if (finishCountdownSeconds <= 0) { clearInterval(finishCountdownTimer); finishCountdownTimer = null; redirectNow(); return; }
          btnHome.textContent = needLogout ? `登出 (${finishCountdownSeconds}s)` : `回到首頁 (${finishCountdownSeconds}s)`;
        }, 1000);
      }
      async function redirectNow() {
        try { if (!endCalled) await endSession(); } catch (e) { console.warn('redirect endSession err', e); }
        if (finishCountdownTimer) { clearInterval(finishCountdownTimer); finishCountdownTimer = null; }
        const needLogout = shouldLogoutAfterRound();
        window.location.href = needLogout ? LOGOUT_URL : lastKnownHome;
      }
      async function submitAnswer(choice) {
        if (submitLocked) return; submitLocked = true;
        const q = questions[current]; if (!q) return;
        setOptionsEnabled(false);
        try {
          const res = await fetch(API + '/submit_answer', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
            body: JSON.stringify({ id: q.id, selected: q.options[choice] })
          });
          const ct = (res.headers.get('content-type') || '').toLowerCase();
          if (!res.ok) { const t = await res.text(); console.error('[submit_answer] not ok', res.status, t.slice(0, 300)); throw new Error('HTTP ' + res.status); }
          if (!ct.includes('application/json')) { const t = await res.text(); console.error('[submit_answer] non-json', ct, t.slice(0, 300)); throw new Error('Non-JSON response'); }
          const data = await res.json();
          const correct = !!data.correct;
          sendResultToDevice(correct);
          if (correct) { feedbackEl.textContent = "太棒了！你答對了！"; feedbackEl.style.color = 'green'; score += 1; }
          else { feedbackEl.textContent = `沒關係，再試一次喔！ 正確答案：${data.correct_answer ?? ''}`; feedbackEl.style.color = 'red'; }
          const aiFeedback = data.feedback && String(data.feedback).trim().length ? data.feedback.trim() : (correct ? "你好棒！這題你答對了！" : "這個表情好像不是這樣喔，再想一想看看");
          if (aiFeedback) { const line = document.createElement('div'); line.textContent = aiFeedback; line.style.marginTop = '8px'; line.style.color = '#333'; feedbackEl.appendChild(line); }
          let nextQueued = false;
          const goNext = () => { if (nextQueued) return; nextQueued = true; waitingToAdvance = false; pendingNext = null; current += 1; currentRid = null; renderQuestion(); };
          waitingToAdvance = true; pendingNext = goNext;
          if (aiFeedback) {
            try { await speakOnceAsync(aiFeedback, { delay: 300 }); await waitForSpeakToFinish({ maxMs: 12000, alsoWaitVisible: true }); await new Promise(r => setTimeout(r, 150)); } catch (_) { }
            goNext();
          } else { setTimeout(goNext, 200); }
        } catch (e) {
          console.error(e);
          feedbackEl.textContent = '送出答案時發生錯誤，請再試一次。';
          feedbackEl.style.color = '#a00';
          setOptionsEnabled(true);
          submitLocked = false;
        }
      }
      function showExitConfirm() { exitModal.style.display = 'flex'; }
      function hideExitConfirm() { exitModal.style.display = 'none'; }
      async function exitQuiz() {
        try { await endSession(); } catch (_) { }
        hardStopTTS();
        const needLogout = shouldLogoutAfterRound();
        window.location.replace(needLogout ? LOGOUT_URL : lastKnownHome);
      }
      window.addEventListener('beforeunload', () => {
        hardStopTTS();
        if (endCalled) return;
        endCalled = true;
        navigator.sendBeacon(API + '/end_session', new Blob([JSON.stringify({ correct_count: score, total_questions: questions.length })], { type: 'application/json' }));
      });
      window.addEventListener('pagehide', hardStopTTS, { capture: true });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { hardStopTTS(); pausedByHide = true; return; }
        try { if (questions?.length && current < questions.length && !speechSynthesis.speaking) { speakCurrentQuestion(false); } } catch (_) { }
      });

      /* ===== 硬體（沿用） ===== */
      function reflectHWStatus(connected) {
        if (!connectBtn) return;
        if (connected) { connectBtn.textContent = '✅ 硬體已連線'; connectBtn.classList.add('connected'); }
        else { connectBtn.textContent = '連接硬體（未連線）'; connectBtn.classList.remove('connected'); }
      }
      function getTwoOptionButtons() {
        const list = optionButtons.filter(Boolean).filter(el => el.offsetParent !== null);
        if (list.length < 2) {
          const more = Array.from(document.querySelectorAll('.options .option-btn')).filter(el => el.offsetParent !== null);
          if (more.length >= 2) return [more[0], more[1]];
        }
        return [list[0] || null, list[1] || null];
      }
      function readLabel(btn) { return stripEmoji(btn?.textContent || btn?.innerText || ''); }
      function genRID() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
      function writeHW(line) {
        try { if (window.SerialHW && window.SerialHW.connected) { window.SerialHW.write(line); return; } } catch (_) { }
        if (window.__QuizLocalHW?.connected && window.__QuizLocalHW?.write) { window.__QuizLocalHW.write(line); }
      }
      function sendCurrentOptionsToDevice() {
        const isConnected = !!(window.SerialHW?.connected || window.__QuizLocalHW?.connected);
        if (!isConnected) return;
        const [a, b] = getTwoOptionButtons(); if (!a || !b) return;
        const la = readLabel(a), lb = readLabel(b); if (!la || !lb) return;
        currentRid = genRID();
        const A = EMO_CH2EN[la] || la; const B = EMO_CH2EN[lb] || lb;
        writeHW(`Q,${currentRid},${A},${B}`);
      }
      function handleDeviceLine(line) {
        const parts = String(line || '').split(',').map(s => s.trim());
        if (parts[0] !== 'ANS' || parts.length !== 3) return;
        const rid = parts[1], ab = parts[2]; if (!rid || rid !== currentRid) return;
        const [a, b] = getTwoOptionButtons();
        const idx = (ab === 'A') ? 0 : 1;
        const target = [a, b][idx];
        if (target) { target.click(); }
      }
      function sendResultToDevice(isCorrect) {
        if (!currentRid) return;
        writeHW(`R,${currentRid},${isCorrect ? 'OK' : 'NG'}`);
        setTimeout(() => { currentRid = null; }, 120);
      }
      function hookGlobalSingleton() {
        if (!window.SerialHW) return false;
        try {
          window.addEventListener('hw-status', (e) => { reflectHWStatus(!!e?.detail?.connected); if (e?.detail?.connected) setTimeout(sendCurrentOptionsToDevice, 80); });
          window.addEventListener('hw-line', (e) => { const line = (typeof e?.detail === 'string') ? e.detail : ''; if (line) handleDeviceLine(line); });
        } catch (_) { }
        connectBtn?.addEventListener('click', () => window.SerialHW.connect());
        try { window.SerialHW.tryReconnect(); } catch (_) { }
        reflectHWStatus(!!window.SerialHW.connected);
        if (window.SerialHW.connected) setTimeout(sendCurrentOptionsToDevice, 120);
        return true;
      }
      function setupLocalFallback() {
        if (!('serial' in navigator)) return;
        const state = { port: null, reader: null, writer: null, decoder: null, connected: false };
        async function openSelected(p) {
          await p.open({ baudRate: 115200 });
          state.decoder = new TextDecoderStream();
          p.readable.pipeTo(state.decoder.writable);
          state.reader = state.decoder.readable.getReader();
          state.writer = p.writable.getWriter();
          state.port = p; state.connected = true;
          reflectHWStatus(true);
          readLoop();
          setTimeout(sendCurrentOptionsToDevice, 80);
        }
        async function readLoop() {
          let buf = ''; try {
            while (state.connected && state.reader) {
              const { value, done } = await state.reader.read();
              if (done) break;
              if (value) {
                buf += value;
                let i; while ((i = buf.indexOf('\n')) >= 0) {
                  const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
                  if (line) handleDeviceLine(line);
                }
              }
            }
          } catch (_) { }
          cleanup();
        }
        function cleanup() {
          if (!state.connected) return;
          state.connected = false; reflectHWStatus(false);
          try { state.reader?.releaseLock(); } catch (_) { }
          try { state.writer?.releaseLock(); } catch (_) { }
          state.reader = state.writer = state.decoder = null;
          state.port = null; currentRid = null;
        }
        async function connect() {
          try {
            const pre = await navigator.serial.getPorts();
            const p = pre[0] || await navigator.serial.requestPort();
            await openSelected(p);
            navigator.serial.addEventListener('disconnect', cleanup);
          } catch (e) { console.error(e); alert('連線失敗：' + e); cleanup(); }
        }
        async function tryReconnect() {
          try {
            const pre = await navigator.serial.getPorts();
            if (pre.length) { await openSelected(pre[0]); } else { reflectHWStatus(false); }
          } catch (_) { cleanup(); }
        }
        async function write(line) {
          if (!state.connected || !state.writer) return;
          const data = new TextEncoder().encode(line.endsWith('\n') ? line : (line + '\n'));
          try { await state.writer.write(data); } catch (_) { }
        }
        window.__QuizLocalHW = { get connected() { return state.connected; }, connect, tryReconnect, write };
        connectBtn?.addEventListener('click', connect);
        tryReconnect(); reflectHWStatus(state.connected);
        if (state.connected) setTimeout(sendCurrentOptionsToDevice, 120);
      }

      /* ===== DOM 監看 ===== */
      const optsRoot = document.querySelector('.options') || document.body;
      const mo = new MutationObserver(() => { setTimeout(sendCurrentOptionsToDevice, 50); });
      mo.observe(optsRoot, { childList: true, subtree: true });
      if (progressBar) {
        const mo2 = new MutationObserver(() => setTimeout(sendCurrentOptionsToDevice, 50));
        mo2.observe(progressBar, { childList: true, subtree: false });
      }
      /* ===== Loading 動畫控制 ===== */

      let loadingInterval = null;
      function startLoadingAnimation() {
        const bar = document.getElementById('loadingBarInner');
        let progress = 0;

        loadingInterval = setInterval(() => {
          // 前 40% 慢慢跑
          if (progress < 40) progress += (Math.random() * 3 + 1);

          // 40%~80% 慢速增加
          else if (progress < 80) progress += (Math.random() * 2 + 0.5);

          // 80% 之後很慢，等待真正完成
          else if (progress < 95) progress += (Math.random() * 1);

          if (progress > 98) progress = 98;

          bar.style.width = progress + "%";
        }, 120);
      }

      function finishLoadingAnimation() {
        const wrap = document.getElementById('loadingBarWrapper');
        const bar = document.getElementById('loadingBarInner');

        if (loadingInterval) clearInterval(loadingInterval);

        // 直接跑到 100%
        bar.style.width = '100%';

        // 0.4 秒後淡出
        setTimeout(() => {
          wrap.style.transition = "opacity .4s ease";
          wrap.style.opacity = 0;

          // 完全移除
          setTimeout(() => { wrap.style.display = 'none'; }, 400);
        }, 400);
      }
      /* ===== 題目載入：先 Prime，再 render，再整回合預載 ===== */
      async function loadQuestions() {
        startLoadingAnimation();
        const my = ++loadToken;
        try {
          const url = API + '/get_questions?s_type=' + encodeURIComponent(sType);
          const res = await fetch(url, { method: 'GET', cache: 'no-store', headers: { 'Accept': 'application/json' }, credentials: 'same-origin' });
          const ct = (res.headers.get('content-type') || '').toLowerCase();
          if (!res.ok) { const t = await res.text(); console.error('[get_questions] not ok', res.status, t.slice(0, 300)); throw new Error('HTTP ' + res.status); }
          if (!ct.includes('application/json')) { const t = await res.text(); console.error('[get_questions] non-json', ct, t.slice(0, 300)); throw new Error('Non-JSON response'); }
          const qs = await res.json();
          if (my !== loadToken) return;
          questions = Array.isArray(qs) ? qs : [];
          if (questions.length === 0) {
            if (!firstRenderDone) {
              questionText.textContent = '目前沒有題目，請稍後再試。';
              document.querySelector('.options').style.display = 'none';
            }
            return;
          }

          /* ✅ 先把前 3 題預載完成（最多等 2.5s），再顯示第一題 */
          try { await preloadPrime([0, 1, 2], 2500); } catch (_) { }

          renderQuestion();

          if (!firstRenderDone) {
            finishLoadingAnimation();   // ← 第一次題目渲染後結束 loading
          }
          firstRenderDone = true;


        } catch (e) {
          console.error('loadQuestions error:', e);
          if (!firstRenderDone && my === loadToken) { questionText.textContent = '載入題目失敗，請重新整理頁面。'; }
        }
      }

      async function endSession() {
        if (endCalled) return; endCalled = true;
        try {
          const res = await fetch(API + '/end_session', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
            body: JSON.stringify({ correct_count: score, total_questions: questions.length })
          });
          if (res.ok) { const data = await res.json().catch(() => null); if (data?.home_url) lastKnownHome = data.home_url; }
        } catch (e) { console.error('end_session error:', e); }
      }

      /* ===== 初始化 ===== */
      speechSynthesis.getVoices();
      (function init() {
        window.addEventListener('DOMContentLoaded', () => { if (!hookGlobalSingleton()) setupLocalFallback(); });
        try { if (localStorage.getItem('tts.enabled') === '0') localStorage.setItem('tts.enabled', '1'); } catch (_) { }
        (async () => { await startSession(); await loadQuestions(); })();
      })();
      console.log('[quiz] lastKnownHome =', lastKnownHome);

      /* ===== 對外 ===== */
      window.submitAnswer = submitAnswer;
      window.exitQuiz = exitQuiz;
      window.showExitConfirm = showExitConfirm;
      window.hideExitConfirm = hideExitConfirm;
        </script>
    </body>
</html>
