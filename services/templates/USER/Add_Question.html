<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上傳自訂題庫</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    /* ===== 桌機版：維持本頁背景，不更動 ===== */
    body {
      font-family: 'ZCOOL KuaiLe', "微軟正黑體", sans-serif; margin: 0; background: #fff;
      background-image: url('{{ url_for("static", filename="9.png") }}');
      background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; overflow-x: hidden;
    }

    /* ===== 導覽列（桌機）— 完全對齊 User_Home.html ===== */
    .navbar {
      background: linear-gradient(to top, rgba(230,230,230,0), rgb(182,240,245));
      padding: 30px 24px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 1000;
    }
    .logo {
      font-size: 55px; font-weight: bold; color: #603d2b; cursor: pointer;
      font-family: 'ZCOOL KuaiLe', sans-serif;
    }
    .nav-links { display: flex; align-items: center; gap: 40px; }
    .nav-links a {
      text-decoration: none; font-size: 24px; font-weight: bold; color:#603d2b;
      transition: color 0.3s; font-family: "ZCOOL KuaiLe",sans-serif;
    }
    .nav-links a:hover { color: #f3b340; }
    .login-out {
      background-color: white; border: 2px solid #999; border-radius: 30px;
      padding: 8px 20px; cursor: pointer; font-weight: bold; transition: background-color 0.3s;
    }
    .login-out:hover { background-color: #f3b340; color: white; }

    /* 本頁原有按鈕/卡片 */
    .btn { padding: 10px 20px; background-color: #00aaff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .btn-gray { background:#ccc; color:#333; }
    .container { padding: 20px; text-align: center; }
    .scroll-container { display: flex; flex-wrap: wrap; gap: 20px; padding-bottom: 10px; justify-content: center; }
    .question-card { width: 220px; border-radius: 12px; box-shadow: 2px 2px 6px rgba(0,0,0,0.2); padding: 15px; text-align: center; background: #f9f9f9; position: relative; }
    .upload-box { width: 100%; height: 120px; border: 2px dashed #ccc; border-radius: 6px; display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:10px; cursor: pointer; }
    .preview { width:100%; height:120px; object-fit:cover; border-radius:6px; display:block; }
    input[type="text"] { width: 100%; padding: 6px 10px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
    .row { display:flex; gap:10px; justify-content:center; margin-top: 12px; flex-wrap: wrap;}
    .muted { font-size:12px; color:#888; }
    .hidden { display:none; }

    /* 右上角刪除鈕 */
    .card-x {
      position:absolute; right:8px; top:8px;
      width:26px; height:26px; border-radius:50%;
      border:none; cursor:pointer; font-weight:900;
      background:rgba(0,0,0,.55); color:#fff; line-height:26px;
    }
    .card-x:hover { background:rgba(220,38,38,.9); }

    /* 導覽列設定按鈕（與首頁一致） */
    .nav-settings{
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 12px; border: 2px solid #c9b9a8;
      background: #fff9e8; cursor: pointer; transition: all .2s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,.06);
    }
    .nav-settings:hover{ background:#fbe1a8; transform: translateY(-1px); }

    /* 系統設定 Modal（與首頁一致） */
    .sysset-modal{ position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 18px; }
    .sysset-modal[aria-hidden="false"]{ display: flex; }
    .sysset-dialog{ width: min(720px, 92vw); background: #fffef8; border: 2px solid #f3deb7; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.22); overflow: hidden; animation: sysset-pop .12s ease-out; }
    @keyframes sysset-pop{ from{ transform: scale(.98); opacity:.5 } to{ transform: scale(1); opacity:1 } }
    .sysset-header{ display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; background: linear-gradient(180deg,#fff7dc,#fffef6); border-bottom: 1px solid #f0e2c4; }
    .sysset-header h3{ margin:0; color:#603d2b; font-size:20px; letter-spacing:.5px; }
    .sysset-close{ border:none; background:transparent; cursor:pointer; font-size:20px; padding:6px 10px; border-radius:10px; color:#603d2b; }
    .sysset-close:hover{ background:#fff0cc; }
    .sysset-body{ padding: 16px; display:grid; gap:16px; }
    .sysset-card{ background:#ffffff; border: 1px solid #f0e2c4; border-radius:14px; padding:14px; box-shadow: 0 10px 24px rgba(0,0,0,.05); }
    .sysset-card h4{ margin: 0 0 6px; color:#603d2b; }
    .sysset-hint{ color:#8b6b55; margin:.25rem 0 .75rem; }
    .sysset-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sysset-grid label{ display:grid; gap:6px; font-size:14px; color:#6b4b35; }
    .sysset-grid input{ padding:10px 12px; border:1px solid #e8d9b8; border-radius:12px; font-size:16px; background:#fffef8; }
    .sysset-actions{ display:flex; gap:10px; margin-top:8px; }
    .sysset-primary{ background:#f3b340; color:#fff; border:none; border-radius:12px; padding:10px 14px; cursor:pointer; box-shadow: 0 6px 14px rgba(243,179,64,.35); }
    .sysset-primary:hover{ filter: brightness(1.05); }
    .sysset-ghost{ background:#fff8e6; color:#8b6b35; border:1px solid #f0e2c4; border-radius:12px; padding:10px 14px; cursor:pointer; }
    .sysset-ghost:hover{ background:#ffefc8; }
    .sysset-status{ margin-top:8px; font-weight:700; color:#603d2b; }
    .sysset-slider-row{ display:flex; align-items:center; gap:12px; }
    .sysset-slider-row input[type="range"]{ width:100%; accent-color:#f3b340; }
    .sysset-row{ display:flex; align-items:center; gap:12px; margin-top:8px; color:#603d2b; }

    /* 倒數提醒 */
    .sysset-toast{ position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background:#111827; color:#fff; padding: 10px 14px; border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.25); z-index: 2001; }

    /* ===== 手機導覽列占位 spacer（本頁保留，供固定 Navbar 時不擋內容） ===== */
    .nav-spacer{ display:none; }

    /* ===== 手機（<=768px）只動外觀，不動功能 ===== */
    @media (max-width:768px){
      .navbar{
        position: fixed !important; top:0; left:0; right:0;
        padding:12px 16px !important;
        background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,0)) !important;
        backdrop-filter: blur(2px);
        z-index:1200;
      }
      .nav-spacer{ display:block; height:0; }
      .container{ padding-top:8px !important; }

      .logo{ font-size: 28px !important; }
      .nav-links{ gap: 10px !important; }
      .nav-links a{ font-size: 16px !important; padding: 6px 10px; background: rgba(255,255,255,.9); border-radius: 999px; }
      .nav-settings{ width: 40px; height: 40px; }
      .login-out{ padding: 6px 12px !important; border-radius: 20px !important; font-size: 14px; }

      /* 上方返回（若有）在手機隱藏；底部用回到首頁鈕 */
      .top-cancel{ display:none !important; }
      .mobile-back{
        display:block; width: fit-content; max-width: 92vw; margin: 20px auto 32px;
        padding: 12px 20px; text-align: center; background:#555; color:#fff; border-radius:999px;
        text-decoration:none; box-shadow:0 6px 16px rgba(0,0,0,.12);
      }
    }

    /* 底部「放棄新增並返回」 */
    .back-btn{
      display:block; margin: 28px auto 12px; padding: 12px 26px; font-size: 18px;
      border:none; background-color:#603d2b; color:#fff; border-radius:999px; cursor:pointer;
      box-shadow:0 6px 16px rgba(0,0,0,.12);
    }
    .back-btn:active{ transform: translateY(1px); }
    @media (max-width:768px){ .back-btn{ margin: 32px auto 24px; } }

    /* === 手機漢堡選單（保留原功能，對齊首頁視覺） === */
    .hamburger{ display:none; }
    .mobile-menu, .mobile-menu-backdrop{ display:none; }
    .mobile-menu.active{ display:block; }
    .mobile-menu-backdrop.active{ display:block; }

    @media (max-width: 768px){
      .nav-links{ display: none !important; }
      .hamburger{
        display: inline-flex; align-items:center; justify-content:center;
        width: 44px; height: 44px; border-radius: 12px;
        border: 2px solid #c9b9a8; background: #fff9e8;
        cursor: pointer; transition: all .2s ease;
        box-shadow: 0 6px 12px rgba(0,0,0,.06); z-index: 1400;
      }
      .hamburger:hover{ background:#fbe1a8; transform: translateY(-1px); }

      .mobile-menu{
        position: fixed; top: 64px; right: 12px;
        width: min(380px, calc(100dvw - 24px));
        max-height: calc(100dvh - 88px);
        overflow-y: auto; overflow-x: hidden; box-sizing: border-box;
        background: #ffffffee; border: 1px solid #f0e2c4; border-radius: 16px;
        box-shadow: 0 16px 36px rgba(0,0,0,.18); padding: 8px; z-index: 1300;
        backdrop-filter: blur(4px);
      }
      .mobile-menu-title{
        position: sticky; top: 0; background: #fffdf6; color:#603d2b;
        font-weight: 900; font-size: 18px; letter-spacing: .5px; text-align: center;
        padding: 12px 12px 12px; margin: -8px -8px 12px;
        border-top-left-radius: 16px; border-top-right-radius: 16px;
        box-shadow: inset 0 -1px 0 #f0e2c4; z-index: 1;
      }
      .mobile-menu a, .mobile-menu button{
        display:flex; align-items:center; justify-content:center; gap:10px;
        width:100%; box-sizing:border-box; text-align:center;
        padding: 12px 14px; font-size: 16px; font-weight:700; color:#603d2b;
        background:#fff; border:1px solid #f0e2c4; border-radius:12px;
        margin:6px 0; text-decoration:none; box-shadow:0 6px 14px rgba(0,0,0,.05);
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      .mobile-menu a:active, .mobile-menu button:active{ transform: scale(.99); }

      .mobile-menu .logout{
        background:#f3b340 !important; color:#ffffff !important;
        border: 1px solid #f3b340 !important; box-shadow: 0 6px 14px rgba(243,179,64,.25);
      }
      .mobile-menu .logout:hover{ filter: brightness(1.05); }

      .mobile-menu-backdrop{
        position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 1250;
      }
    }

    /* 手機：三顆藍色按鈕並排（原功能不動） */
    @media (max-width: 768px){
      .row{
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        justify-items: stretch; align-items: stretch; margin-top: 16px;
      }
      .row .btn{
        width: 100%; padding: 12px 8px; font-size: 16px; line-height: 1.2;
        white-space: nowrap; border-radius: 12px;
      }
    }
    @media (max-width: 360px){
      .row .btn{ padding: 10px 6px; font-size: 14px; }
    }
  </style>
</head>

  <!-- ====== 導覽列 spacer 高度同步（手機用） ====== -->
  <script>
  (function(){
    const nav = document.querySelector('.navbar');
    const spacer = document.querySelector('.nav-spacer');
    if(!nav || !spacer) return;
    function setSpacer(){ spacer.style.height = (nav.offsetHeight || 0) + 'px'; }
    window.addEventListener('load', setSpacer);
    window.addEventListener('resize', setSpacer);
    window.addEventListener('orientationchange', setSpacer);
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(setSpacer); }
    const ro = new ResizeObserver(setSpacer); ro.observe(nav);
  })();
  </script>

  <!-- 手機：漢堡選單控制（功能與首頁一致；桌機不受影響） -->
  <script>
  (function(){
    const btn = document.getElementById('mobileMenuBtn');
    const menu = document.getElementById('mobileMenu');
    const backdrop = document.getElementById('mobileMenuBackdrop');
    const logoutUrl = document.body.getAttribute('data-logout-url') || '/logout';
    const openSettingsBtn = document.getElementById('openSettings');
    const mobileOpenSettings = document.getElementById('mobileOpenSettings');
    const mobileLogout = document.getElementById('mobileLogout');
    if(!btn || !menu || !backdrop) return;

    const mq = window.matchMedia('(max-width: 768px)');
    function syncBurger(){
      const show = mq.matches;
      btn.style.display = show ? 'inline-flex' : 'none';
      if(!show){
        menu.classList.remove('active');
        backdrop.classList.remove('active');
        btn.setAttribute('aria-expanded','false');
        menu.setAttribute('aria-hidden','true');
      }
    }
    syncBurger();
    mq.addEventListener('change', syncBurger);

    function toggleMenu(force){
      const willOpen = (force === true) || (force !== false && !menu.classList.contains('active'));
      menu.classList.toggle('active', willOpen);
      backdrop.classList.toggle('active', willOpen);
      btn.setAttribute('aria-expanded', String(willOpen));
      menu.setAttribute('aria-hidden', String(!willOpen));
    }
    btn.addEventListener('click', ()=>toggleMenu());
    backdrop.addEventListener('click', ()=>toggleMenu(false));

    mobileOpenSettings?.addEventListener('click', ()=>{
      toggleMenu(false);
      openSettingsBtn?.click();
    });
    mobileLogout?.addEventListener('click', ()=>{
      toggleMenu(false);
      location.href = logoutUrl;
    });
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && menu.classList.contains('active')) toggleMenu(false);
    });
  })();
  </script>

  <script>
    const EMOS = ["快樂","悲傷","憤怒","恐懼","驚訝","厭惡"];
    const API_BASE = "/ai/custom";
    const PAGE_LIST_URL = JSON.parse('{{ url_for("custom.page_list") | tojson | safe }}');

    const EDIT_SET_ID = Number(new URLSearchParams(location.search).get('set_id') || 0);
    let questionCount = 0;
    const maxQuestions = 10;
    if (EDIT_SET_ID) { document.getElementById('btnSave').textContent = '儲存修改'; }

    function refreshCount(){ questionCount = document.querySelectorAll('.question-card').length; }

    function attachDelete(card){
      if(!card.querySelector('.card-x')){
        const btn = document.createElement('button');
        btn.className = 'card-x'; btn.type = 'button'; btn.innerText = '×'; btn.title = '刪除這一題';
        card.appendChild(btn);
      }
      const btn = card.querySelector('.card-x');
      btn.onclick = ()=>{
        try{
          const img = card.querySelector('.preview');
          if(card._file && img && img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
        }catch(_){}
        card.remove();
        refreshCount();
      };
    }

    function createCard(index, fileObj){
      const url = URL.createObjectURL(fileObj);
      const tpl = document.createElement('div');
      tpl.className = 'question-card';
      tpl.dataset.index = index;
      tpl.innerHTML = `
        <button type="button" class="card-x" title="刪除這一題">×</button>
        <img class="preview" src="${url}" alt="預覽圖" />
        <input type="text" placeholder="題目（已自動帶入，可修改）" class="q-text">
        <label style="font-size:12px;color:#555;display:block;text-align:left;margin:4px 0 6px;">答案（AI 會自動填；AI 失敗時請手選）</label>
        <select class="q-ans">
          <option value="">— 請選擇 —</option>
          <option value="angry">angry生氣</option>
          <option value="disgust">disgust厭惡</option>
          <option value="fear">fear害怕</option>
          <option value="happy">happy開心</option>
          <option value="sad">sad難過</option>
          <option value="surprise">surprise驚訝</option>
        </select>
        <div class="muted">AI 成功後會記住圖片連結；若 AI 失敗請先選擇答案再儲存。</div>
      `;
      tpl._file = fileObj;
      attachDelete(tpl);
      return tpl;
    }

    function canAdd(n){ refreshCount(); const remain = maxQuestions - questionCount; return Math.max(0, Math.min(remain, n)); }

    function addCardsFromFiles(fileList){
      if(!fileList || !fileList.length) return;
      const n = canAdd(fileList.length);
      if(n <= 0) { alert(`最多只能新增 ${maxQuestions} 題`); return; }
      const container = document.getElementById('questionContainer');
      for(let i=0;i<n;i++){
        const file = fileList[i];
        if(!file.type.startsWith('image/')) continue;
        const card = createCard(questionCount, file);
        container.appendChild(card);
      }
      refreshCount();
    }

    document.getElementById('btnAdd').addEventListener('click', ()=>{ document.getElementById('multiPicker').click(); });
    document.getElementById('multiPicker').addEventListener('change', (e)=>{ addCardsFromFiles(e.target.files); e.target.value=''; });

    async function runAIAll() {
      const cards = [...document.querySelectorAll('.question-card')];
      const withFiles = cards.filter(c => !!c._file);
      if (!withFiles.length) return alert("請先新增題目並選擇圖片。");

      const fd = new FormData();
      fd.append('s_type', '圖片');
      withFiles.forEach(c => fd.append('files[]', c._file, c._file.name));

      const btn = document.getElementById('btnAI');
      const oldText = btn.textContent;
      btn.disabled = true; btn.textContent = 'AI 辨識中…';

      try {
        const res = await fetch(`${API_BASE}/api/recognize`, { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error || `辨識失敗（HTTP ${res.status}）`);

        data.forEach((item, i) => {
          const card = withFiles[i];
          if (!card) return;
          card.querySelector('.q-text').value = item.question_text || "這張圖片的人看起來是什麼情緒？";
          card.querySelector('.q-ans').value = item.raw_label || "";
          card.dataset.mediaUrl = item.media_url || '';
        });

        alert("AI 辨識完成，題目已帶入；有成功的會自動選答案。");
      } catch (e) {
        alert(e.message || "AI 辨識失敗");
      } finally {
        btn.disabled = false; btn.textContent = oldText;
      }
    }

    async function saveAll() {
      const title = document.getElementById('quizTitle').value.trim();
      const cards = [...document.querySelectorAll('.question-card')];

      const items = [];
      for (const card of cards) {
        const q = card.querySelector('.q-text').value.trim();
        const ansEn = card.querySelector('.q-ans').value.trim();
        const mediaUrl = card.dataset.mediaUrl || '';

        if (!mediaUrl) return alert("有圖片尚未 AI 辨識完成，請先點『AI 辨識（全部）』。");
        if (!ansEn) return alert("有題目的答案未選擇（AI 失敗時需手動選擇六大情緒）。");

        items.push({ question_text: q || "這張圖片的人看起來是什麼情緒？", answer: ansEn, media_url: mediaUrl });
      }

      if (!items.length) return alert("沒有任何題目可以儲存。");

      try {
        const payload = { title, items };
        if (EDIT_SET_ID) payload.set_id = EDIT_SET_ID;

        const res = await fetch(`${API_BASE}/api/save_set`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data?.error || `儲存失敗（HTTP ${res.status}）`);

        alert(`${EDIT_SET_ID ? '已更新題庫' : '已建立題庫'}（set_id=${data.set_id}），共 ${data.saved} 題！`);
        location.href = PAGE_LIST_URL;
      } catch (e) { alert(e.message || "儲存失敗"); }
    }

    const EMO_ZH_TO_EN = { "生氣":"angry","厭惡":"disgust","害怕":"fear","開心":"happy","難過":"sad","驚訝":"surprise" };

    async function bootstrapEdit(){
      if (!EDIT_SET_ID) return;
      try{
        const mres = await fetch(`${API_BASE}/api/set/${EDIT_SET_ID}`);
        const meta = await mres.json();
        if (mres.ok) document.getElementById('quizTitle').value = meta.set_title || '';

        const qres = await fetch(`${API_BASE}/api/set/${EDIT_SET_ID}/questions`);
        const qs = await qres.json();
        if (!qres.ok) throw new Error(qs?.error || qres.status);

        const container = document.getElementById('questionContainer');
        qs.forEach(q=>{
          const card = document.createElement('div');
          card.className = 'question-card';
          card.dataset.index = (questionCount++);
          card.dataset.mediaUrl = q.c_media_url || '';

          const en = EMO_ZH_TO_EN[(q.c_answer||"").trim()] || "";
          card.innerHTML = `
            <button type="button" class="card-x" title="刪除這一題">×</button>
            <img class="preview" src="${q.c_media_url||''}" alt="預覽圖" />
            <input type="text" class="q-text" placeholder="題目（已自動帶入，可修改）" value="${(q.c_text||'').replace(/"/g,'&quot;')}">
            <label style="font-size:12px;color:#555;display:block;text-align:left;margin:4px 0 6px;">答案（AI 會自動填；AI 失敗時請手選）</label>
            <select class="q-ans">
              <option value="">— 請選擇 —</option>
              <option value="angry">angry生氣</option>
              <option value="disgust">disgust厭惡</option>
              <option value="fear">fear害怕</option>
              <option value="happy">happy開心</option>
              <option value="sad">sad難過</option>
              <option value="surprise">surprise驚訝</option>
            </select>
            <div class="muted">AI 成功後會記住圖片連結；若 AI 失敗請先選擇答案再儲存。</div>
          `;
          card.querySelector('.q-ans').value = en;
          attachDelete(card);
          container.appendChild(card);
        });
      }catch(e){ alert("載入題庫失敗：" + (e.message||e)); }
    }

    document.getElementById('btnAI').addEventListener('click', runAIAll);
    document.getElementById('btnSave').addEventListener('click', saveAll);
    window.addEventListener('load', bootstrapEdit);
  </script>

  <!-- 系統設定：開關、語速、時間控管（沿用） -->
  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const openBtn  = $('#openSettings');
    const modal    = $('#sysSettingsModal');
    const closeBtn = $('#sysSettingsClose');

    const inputH   = $('#timeHours');
    const inputM   = $('#timeMinutes');
    const btnStart = $('#timerStart');
    const btnStop  = $('#timerStop');
    const remainEl = $('#timeRemain');

    const rate     = $('#ttsRate');
    const rateLbl  = $('#ttsRateLabel');
    const btnTest  = $('#ttsTest');
    const enabled  = $('#ttsEnabled');

    const logoutUrl = document.body.getAttribute('data-logout-url') || '/logout';

    const openModal  = () => modal.setAttribute('aria-hidden','false');
    const closeModal = () => modal.setAttribute('aria-hidden','true');
    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    const initRate = () => {
      let saved = parseFloat(localStorage.getItem('tts.rate'));
      if (Number.isNaN(saved)) saved = 1.0;
      saved = Math.min(2, Math.max(0.5, saved));
      rate.value = saved.toFixed(2);
      rateLbl.textContent = saved.toFixed(2) + '×';
      window.StarSpeech && (window.StarSpeech.rate = saved);
      localStorage.setItem('tts.rate', saved.toFixed(2));
    };
    const initEnabled = () => {
      const on = (localStorage.getItem('tts.enabled') ?? '1') !== '0';
      enabled.checked = on;
      window.StarSpeech && (window.StarSpeech.enabled = on);
      localStorage.setItem('tts.enabled', on ? '1' : '0');
    };
    rate.addEventListener('input', () => {
      let v = parseFloat(rate.value);
      if (Number.isNaN(v)) v = 1.0;
      v = Math.min(2, Math.max(0.5, v));
      rate.value = v.toFixed(2);
      rateLbl.textContent = v.toFixed(2) + '×';
      window.StarSpeech && (window.StarSpeech.rate = v);
      localStorage.setItem('tts.rate', v.toFixed(2));
    });
    enabled.addEventListener('change', () => {
      const on = !!enabled.checked;
      window.StarSpeech && (window.StarSpeech.enabled = on);
      localStorage.setItem('tts.enabled', on ? '1' : '0');
    });
    btnTest.addEventListener('click', () => {
      window.StarSpeech?.speak('這是速度測試。現在的語速是 ' + (window.StarSpeech?.rate ?? 1).toFixed(2) + ' 倍。');
    });
    initRate(); initEnabled();

    const fmt = (ms) => {
      if (ms <= 0) return '00:00';
      const s = Math.floor(ms/1000), m = Math.floor(s/60);
      return String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    };
    const refreshRemain = () => {
      const { active, left } = window.ParentTimer?.status() || {active:false,left:0};
      remainEl.textContent = active ? fmt(left) : '未開始';
      btnStart.disabled = active;
      btnStop.disabled  = !active;
      if (active && left <= 0) window.location.href = logoutUrl;
    };
    btnStart.addEventListener('click', () => {
      const h = Math.max(0, parseInt(inputH.value || '0', 10));
      const m = Math.max(0, parseInt(inputM.value || '0', 10));
      const ms = (h*60 + m) * 60 * 1000;
      if (ms > 0) ParentTimer.start(ms);
    });
    btnStop.addEventListener('click',  () => ParentTimer.stop());
    setInterval(refreshRemain, 500);
    window.addEventListener('storage', (e) => {
      if (e.key === 'timer.active' || e.key === 'timer.endAt') refreshRemain();
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshRemain(); });
    refreshRemain();
  })();
  </script>
</body>
