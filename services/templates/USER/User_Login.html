<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>星星登入</title>
  <!-- 加入與首頁相同的字型（ZCOOL KuaiLe） -->
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
  :root{
    --brand:#D37932;
    --ink:#603d2b;
    --bg:#f5f5f5;
    --card:#ffffff;
    --muted:#666;
    --radius:12px;
    --shadow:0 8px 24px rgba(0,0,0,.12);
    --space:clamp(16px, 2.4vw, 24px);
  }

  /* Base */
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"微軟正黑體", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    color:#111;
    background: var(--bg);
    background-image:url('{{ url_for("static", filename="5.png") }}');
    background-size:cover; background-position:center; background-repeat:no-repeat; background-attachment:fixed;
    display:flex; flex-direction:column; align-items:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  a{ color:inherit; }

  /* 置換：導覽列樣式（與 User_Home 相同風格） */
  .navbar{
    width:100%;
    background: linear-gradient(to top, rgba(230,230,230,0), rgb(182,240,245));
    padding: 30px 24px;
    display:flex; justify-content:space-between; align-items:center;
    position: sticky; top: 0; z-index: 1000;
  }
  .logo{
    font-size: 55px;
    font-weight: bold;
    color: #603d2b;
    cursor: pointer;
    font-family: 'ZCOOL KuaiLe', sans-serif; /* 與首頁一致 */
    user-select: none;
  }
  /* Login 頁不放其他連結，僅保留 Logo 導回首頁 */

  /* Card */
  .box{
    width: min(92vw, 420px);
    margin: clamp(24px, 7vh, 56px) auto 0;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow:hidden;
    backdrop-filter: blur(2px);
  }
  .content{ padding: clamp(20px, 4vw, 28px); text-align:center; }
  .content h2{
    margin: 0 0 18px;
    color: var(--ink);
    font-size: clamp(20px, 3.6vw, 24px);
    letter-spacing:.5px;
  }

  .input-group{ margin-bottom: 14px; }

  .field{
    width:100%;
    padding: 12px 14px;
    border: 1px solid #e6e6e6;
    background:#f7f7f7;
    border-radius:10px;
    font-size: 16px; /* ≥16px 避免 iOS 自動放大 */
    outline: none;
    transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
  }
  .field:focus{
    border-color: #f3b340;
    background:#fffef8;
    box-shadow: 0 0 0 3px rgba(243,179,64,.25);
  }

  .row-inline{
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
    width:100%;
    margin: 4px 0 14px;
    color:#555;
    font-size:14px;
  }
  .show-password{ display:flex; align-items:center; gap:8px; }
  .forgot a{ color:#444; text-decoration:underline; cursor:pointer; }

  .login-btn{
    width:100%;
    background: var(--brand);
    color:#fff;
    border:0;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 16px; font-weight: 700;
    cursor:pointer;
    box-shadow: 0 8px 18px rgba(211,121,50,.25);
    transition: transform .04s ease, filter .15s ease;
    touch-action: manipulation;
  }
  .login-btn:active{ transform: scale(.98); }
  .login-btn:hover{ filter: brightness(1.02); }

  /* Modal backdrop */
  .modal-backdrop{
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    z-index: 1000;
  }
  .modal-backdrop.show{ display:flex; }

  /* Modal */
  .modal{
    width: min(92vw, 420px);
    max-height: min(80vh, 640px);
    background:#fff; border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    padding: 18px;
    display:flex; flex-direction:column; gap:10px;
    overflow:hidden;
  }
  .modal h3{ margin:0 0 4px; font-size: clamp(18px, 3.6vw, 20px); color: var(--ink); }
  .modal p{ margin:0 0 8px; color:#333; line-height:1.5; }
  .modal .scroll{ overflow:auto; }

  .hint{ font-size:13px; color:#666; margin-top:6px; }

  .modal-actions{
    display:flex; justify-content:flex-end; gap:10px; margin-top: 10px;
  }
  .btn{ padding:10px 14px; border-radius:10px; border:0; cursor:pointer; font-size:16px; }
  .btn.secondary{ background:#eeeeee; }
  .btn.primary{ background: var(--brand); color:#fff; }

  /* Mobile tweaks (keep desktop as-is) */
  @media (max-width: 600px){
    /* iOS/Safari: 避免 fixed 背景抖動與高耗能 */
    body{ background-attachment: scroll; }

    .navbar{ padding: 16px 16px; }
    .logo{ font-size: 32px; }

    .box{
      width: 92vw;
      margin: 6vh auto 0;
      border-radius: 14px;
      padding: 0;
    }
    .content{ padding: 22px 18px; }
    .row-inline{ flex-direction:column; align-items:flex-start; gap:8px; }
    .login-btn{ width:100%; padding: 14px 16px; font-size:17px; }
    .field{ font-size:17px; }
  }

  /* Less motion preference */
  @media (prefers-reduced-motion: reduce){
    .login-btn{ transition:none; }
  }
</style>

</head>
<body>
  <!-- 導覽列（樣式與首頁一致；僅保留 Logo 導回首頁，不改動功能） -->
  <header class="navbar">
    <div class="logo" onclick="location.href='{{ url_for('index') }}'">星星的世界</div>
  </header>

  <main class="box" role="main">
    <div class="content">
      <h2>星星登入</h2>

      <div class="input-group">
        <input class="field" type="email" id="email" placeholder="信箱"
               inputmode="email" autocomplete="email" />
      </div>

      <div class="input-group">
        <input class="field" type="password" id="password" placeholder="密碼"
               autocomplete="current-password" />
      </div>

      <div class="row-inline">
        <label class="show-password">
          <input type="checkbox" id="togglePassword" /> 顯示密碼
        </label>
        <div class="forgot">
          <a href="javascript:void(0)" onclick="openForgot()">忘記密碼？</a>
        </div>
      </div>

      <button class="login-btn" onclick="login()">登入</button>
    </div>
  </main>

  <!-- 忘記密碼 Modal -->
  <div id="forgotBackdrop" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal" role="document">
      <h3>重設密碼</h3>
      <div class="scroll">
        <p>請輸入你註冊的電子信箱，我們會寄送重設密碼的連結到你的信箱。</p>
        <div class="input-group">
          <input class="field" type="email" id="forgotEmail" placeholder="example@mail.com"
                 inputmode="email" autocomplete="email" />
          <div class="hint">寄出後請到收件匣或垃圾郵件匣查看郵件。</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="closeForgot()">取消</button>
        <button class="btn primary" onclick="sendForgot()">送出</button>
      </div>
    </div>
  </div>

  <script>
    // 登入
    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      try{
        const resp = await fetch('{{ url_for("auth.api_login") }}', {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await resp.json();
        if(!resp.ok || !data.ok){
          alert(data.msg || "登入失敗"); return;
        }
        window.location.href = data.redirect || "{{ url_for('auth.home') }}";
      }catch(err){
        console.error(err); alert("系統錯誤，請稍後再試");
      }
    }

    // 顯示/隱藏密碼
    document.getElementById("togglePassword").addEventListener("change", (e)=>{
      const pwd = document.getElementById("password");
      pwd.type = e.target.checked ? "text" : "password";
    });

    // 忘記密碼彈窗
    function openForgot(){
      const bd = document.getElementById("forgotBackdrop");
      bd.classList.add("show");
      bd.setAttribute("aria-hidden","false");
      setTimeout(()=> document.getElementById("forgotEmail").focus(), 30);
    }
    function closeForgot(){
      const bd = document.getElementById("forgotBackdrop");
      bd.classList.remove("show");
      bd.setAttribute("aria-hidden","true");
    }
    // 點背景關閉
    document.getElementById("forgotBackdrop").addEventListener("click", (e)=>{
      if(e.target.id === "forgotBackdrop") closeForgot();
    });

    // 送出重設
    async function sendForgot(){
      const email = document.getElementById("forgotEmail").value.trim();
      if(!email){ alert("請輸入信箱"); return; }
      try{
        const resp = await fetch('{{ url_for("auth.api_forgot") }}', {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ email })
        });
        const data = await resp.json();
        alert(data.msg || "若此信箱存在於系統，已寄出重設密碼連結。");
        closeForgot();
      }catch(e){
        console.error(e); alert("系統錯誤，請稍後再試");
      }
    }
  </script>
</body>
</html>
