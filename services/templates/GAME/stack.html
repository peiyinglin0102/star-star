<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,user-scalable=no" />
<title>Stacker 3D (Three.js)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css?family=Comfortaa" rel="stylesheet">
<style>
  :root { --color-dark:#333344; --back-top:16px; --back-left:16px; }
  html,body{margin:0;overflow:hidden;height:100%;width:100%;position:relative;font-family:'Comfortaa',cursive;}
  #container{width:100%;height:100%;}
  #container #score{position:absolute;top:20px;width:100%;text-align:center;font-size:10vh;transition:transform .5s ease;color:var(--color-dark);transform:translateY(-200px) scale(1);}
  #container #game{position:absolute;inset:0;}
  #container .game-over{position:absolute;top:0;left:0;width:100%;height:85%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #container .game-over *{transition:opacity .5s ease,transform .5s ease;opacity:0;transform:translateY(-50px);color:var(--color-dark)}
  #container .game-over h2{margin:0;padding:0;font-size:40px}
  #container .game-ready{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around}
  #container .game-ready #start-button{transition:opacity .5s ease,transform .5s ease;opacity:0;transform:translateY(-50px);border:3px solid var(--color-dark);padding:10px 20px;background:transparent;color:var(--color-dark);font-size:30px;cursor:pointer}
  #container #instructions{position:absolute;width:100%;top:16vh;left:0;text-align:center;transition:opacity .5s ease,transform .5s ease;opacity:0;color:var(--color-dark)}
  #container #instructions.hide{opacity:0!important}
  #container.playing #score,#container.resetting #score{transform:translateY(0) scale(1)}
  #container.playing #instructions{opacity:1}
  #container.ready .game-ready #start-button{opacity:1;transform:translateY(0)}
  #container.ended #score{transform:translateY(6vh) scale(1.5)}
  #container.ended .game-over *{opacity:1;transform:translateY(0)}
  #container.ended .game-over p{transition-delay:.3s}

  /* 通用返回鈕 */
  #back-button{
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + var(--back-top));
    left: calc(env(safe-area-inset-left, 0px) + var(--back-left));
    z-index: 10000;
    display:inline-flex;align-items:center;gap:8px;
    font-size:16px;line-height:1;
    color:#fff;
    background: rgba(0,0,0,.55);
    padding:10px 16px;border-radius:24px;text-decoration:none;font-weight:800;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    transition: background-color .2s, transform .06s ease-in-out;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #back-button:hover{ background: rgba(0,0,0,.7); }
  #back-button:active{ transform: scale(.98); }
</style>
</head>
<body data-logout-url="{{ url_for('auth.logout') }}">
  <script src="{{ url_for('static', filename='js/parent_timer.js') }}?v=20251025-6"></script>
<a href="{{ url_for('auth.home') }}" id="back-button" aria-label="返回首頁">← 返回首頁</a>

<div id="container" class="ready">
  <div id="game"></div>
  <div id="score">0</div>
  <div id="instructions">Click / Space 放下方塊</div>
  <div class="game-over">
    <h2>Game Over</h2>
    <p>你很棒！再來一局？</p>
    <p>Click 或 Space 重新開始</p>
  </div>
  <div class="game-ready">
    <div id="start-button">Start</div>
    <div></div>
  </div>
</div>
  <!-- 全站倒數提醒容器（60s / 30s / 5s 用） -->
<div id="sysCenterWarn" class="sysset-center-warn" aria-hidden="true">
  <div class="sysset-center-box" id="sysCenterWarnBox"></div>
</div>
<!-- 外部庫（新版） -->
<script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
/* —— 返回邏輯 + 自動避位 —— */
(function(){
  const backBtn = document.getElementById('back-button');
  backBtn.addEventListener('click', function(e){
    try{
      const ref = document.referrer;
      if(ref){
        const r = new URL(ref);
        if(r.origin === location.origin){
          e.preventDefault();
          history.back();
          return;
        }
      }
    }catch(_e){}
  });
  function avoidOverlap(){
    document.documentElement.style.setProperty('--back-left','16px');
    document.documentElement.style.setProperty('--back-top','16px');
    const rect = backBtn.getBoundingClientRect();
    let step=8, shifted=0, maxShift=240;
    function covered(){
      const pts=[[rect.left+4,rect.top+4],[rect.left+rect.width/2,rect.top+rect.height/2]];
      return pts.some(([x,y])=>{
        const el=document.elementFromPoint(x,y);
        return el && el!==backBtn && !backBtn.contains(el) && el!==document.body && el!==document.documentElement;
      });
    }
    while(covered() && shifted<=maxShift){
      shifted+=step;
      document.documentElement.style.setProperty('--back-left',(16+shifted)+'px');
      const r2=backBtn.getBoundingClientRect();
      rect.left=r2.left; rect.top=r2.top; rect.width=r2.width; rect.height=r2.height;
    }
  }
  window.addEventListener('load', ()=> setTimeout(avoidOverlap, 0));
  window.addEventListener('resize', ()=> setTimeout(avoidOverlap, 0));
})();

/* 小修正：提供 TweenLite 別名，讓舊寫法可用 */
const TweenLite = gsap;

/* ===== Stage（場景/相機/燈光） ===== */
class Stage {
  constructor(){
    this.container = document.getElementById('game');

    this.renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setClearColor('#D0CBC7', 1);
    this.container.appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();

    const aspect = window.innerWidth / window.innerHeight;
    const d = 20;
    this.camera = new THREE.OrthographicCamera(-d*aspect, d*aspect, d, -d, -100, 1000);
    this.camera.position.set(2,2,2);
    this.camera.lookAt(0,0,0);

    this.light = new THREE.DirectionalLight(0xffffff, 0.5);
    this.light.position.set(0, 499, 0);
    this.scene.add(this.light);

    this.softLight = new THREE.AmbientLight(0xffffff, 0.4);
    this.scene.add(this.softLight);

    window.addEventListener('resize', () => this.onResize());
    this.onResize();
  }
  setCamera(y, speed=0.3){
    TweenLite.to(this.camera.position, {duration:speed, y: y+4, ease: "power1.inOut"});
    this._lookTargetY = y;
  }
  onResize(){
    const viewSize = 30;
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.camera.left = window.innerWidth / -viewSize;
    this.camera.right = window.innerWidth / viewSize;
    this.camera.top = window.innerHeight / viewSize;
    this.camera.bottom = window.innerHeight / -viewSize;
    this.camera.updateProjectionMatrix();
  }
  render(){
    if (this._lookTargetY !== undefined){
      const current = new THREE.Vector3(0, this._lookTargetY, 0);
      this.camera.lookAt(current);
    }
    this.renderer.render(this.scene, this.camera);
  }
  add(obj){ this.scene.add(obj); }
  remove(obj){ this.scene.remove(obj); }
}

/* ===== Block（方塊） ===== */
class Block {
  constructor(targetBlock){
    this.STATES = {ACTIVE:'active', STOPPED:'stopped', MISSED:'missed'};
    this.MOVE_AMOUNT = 12;

    this.dimension = {width:0, height:0, depth:0};
    this.position = {x:0, y:0, z:0};

    this.targetBlock = targetBlock;
    this.index = (this.targetBlock ? this.targetBlock.index : 0) + 1;
    this.workingPlane = this.index % 2 ? 'x' : 'z';
    this.workingDimension = this.index % 2 ? 'width' : 'depth';

    this.dimension.width  = this.targetBlock ? this.targetBlock.dimension.width  : 10;
    this.dimension.height = this.targetBlock ? this.targetBlock.dimension.height : 2;
    this.dimension.depth  = this.targetBlock ? this.targetBlock.dimension.depth  : 10;

    this.position.x = this.targetBlock ? this.targetBlock.position.x : 0;
    this.position.y = this.dimension.height * this.index;
    this.position.z = this.targetBlock ? this.targetBlock.position.z : 0;

    this.colorOffset = this.targetBlock ? this.targetBlock.colorOffset : Math.round(Math.random()*100);

    if (!this.targetBlock){
      this.color = new THREE.Color(0x333344);
    } else {
      const offset = this.index + this.colorOffset;
      const r = Math.sin(0.3*offset)*55 + 200;
      const g = Math.sin(0.3*offset+2)*55 + 200;
      const b = Math.sin(0.3*offset+4)*55 + 200;
      this.color = new THREE.Color(r/255, g/255, b/255);
    }

    this.state = this.index > 1 ? this.STATES.ACTIVE : this.STATES.STOPPED;

    this.speed = -0.1 - (this.index * 0.005);
    if (this.speed < -4) this.speed = -4;
    this.direction = this.speed;

    const geom = new THREE.BoxGeometry(this.dimension.width, this.dimension.height, this.dimension.depth);
    geom.translate(this.dimension.width/2, this.dimension.height/2, this.dimension.depth/2);
    this.material = new THREE.MeshToonMaterial({color:this.color, flatShading:true});
    this.mesh = new THREE.Mesh(geom, this.material);
    this.mesh.position.set(this.position.x, this.position.y, this.position.z);

    if (this.state === this.STATES.ACTIVE){
      this.position[this.workingPlane] = Math.random()>0.5 ? -this.MOVE_AMOUNT : this.MOVE_AMOUNT;
      this.mesh.position[this.workingPlane] = this.position[this.workingPlane];
    }
  }

  reverseDirection(){ this.direction = this.direction > 0 ? this.speed : Math.abs(this.speed); }

  place(){
    this.state = this.STATES.STOPPED;

    let overlap = this.targetBlock.dimension[this.workingDimension] -
      Math.abs(this.position[this.workingPlane] - this.targetBlock.position[this.workingPlane]);

    const ret = { plane:this.workingPlane, direction:this.direction };

    if (this.dimension[this.workingDimension] - overlap < 0.3){
      overlap = this.dimension[this.workingDimension];
      ret.bonus = true;
      this.position.x = this.targetBlock.position.x;
      this.position.z = this.targetBlock.position.z;
      this.dimension.width = this.targetBlock.dimension.width;
      this.dimension.depth = this.targetBlock.dimension.depth;
    }

    if (overlap > 0){
      const choppedDim = { width:this.dimension.width, height:this.dimension.height, depth:this.dimension.depth };
      choppedDim[this.workingDimension] -= overlap;
      this.dimension[this.workingDimension] = overlap;

      const placedG = new THREE.BoxGeometry(this.dimension.width, this.dimension.height, this.dimension.depth);
      placedG.translate(this.dimension.width/2, this.dimension.height/2, this.dimension.depth/2);
      const placedMesh = new THREE.Mesh(placedG, this.material);

      const choppedG = new THREE.BoxGeometry(choppedDim.width, choppedDim.height, choppedDim.depth);
      choppedG.translate(choppedDim.width/2, choppedDim.height/2, choppedDim.depth/2);
      const choppedMesh = new THREE.Mesh(choppedG, this.material);

      const choppedPos = {x:this.position.x, y:this.position.y, z:this.position.z};

      if (this.position[this.workingPlane] < this.targetBlock.position[this.workingPlane]){
        this.position[this.workingPlane] = this.targetBlock.position[this.workingPlane];
      } else {
        choppedPos[this.workingPlane] += overlap;
      }

      placedMesh.position.set(this.position.x, this.position.y, this.position.z);
      choppedMesh.position.set(choppedPos.x, choppedPos.y, choppedPos.z);

      ret.placed = placedMesh;
      if (!ret.bonus) ret.chopped = choppedMesh;
    } else {
      this.state = this.STATES.MISSED;
    }

    this.mesh.position.set(this.position.x, this.position.y, this.position.z);
    return ret;
  }

  tick(){
    if (this.state === this.STATES.ACTIVE){
      const v = this.position[this.workingPlane];
      if (v > this.MOVE_AMOUNT || v < -this.MOVE_AMOUNT) this.reverseDirection();
      this.position[this.workingPlane] += this.direction;
      this.mesh.position[this.workingPlane] = this.position[this.workingPlane];
    }
  }
}

/* ===== Game ===== */
class Game {
  constructor(){
    this.STATES = { LOADING:'loading', PLAYING:'playing', READY:'ready', ENDED:'ended', RESETTING:'resetting' };
    this.blocks = [];
    this.state = this.STATES.LOADING;

    this.stage = new Stage();

    this.mainContainer  = document.getElementById('container');
    this.scoreContainer = document.getElementById('score');
    this.startButton    = document.getElementById('start-button');
    this.instructions   = document.getElementById('instructions');
    this.scoreContainer.innerHTML = '0';

    this.newBlocks    = new THREE.Group();
    this.placedBlocks = new THREE.Group();
    this.choppedBlocks= new THREE.Group();
    this.stage.add(this.newBlocks);
    this.stage.add(this.placedBlocks);
    this.stage.add(this.choppedBlocks);

    this.addBlock(); // base block
    this.tick();

    this.updateState(this.STATES.READY);

    document.addEventListener('keydown', e => { if (e.code === 'Space') this.onAction(); });
    document.addEventListener('click', e => this.onAction());
  }

  updateState(s){
    Object.values(this.STATES).forEach(v => this.mainContainer.classList.remove(v));
    this.mainContainer.classList.add(s);
    this.state = s;
  }

  onAction(){
    switch(this.state){
      case this.STATES.READY:   this.startGame();   break;
      case this.STATES.PLAYING: this.placeBlock();  break;
      case this.STATES.ENDED:   this.restartGame(); break;
    }
  }

  startGame(){
    if (this.state !== this.STATES.PLAYING){
      this.scoreContainer.innerHTML = '0';
      this.updateState(this.STATES.PLAYING);
      this.addBlock();
    }
  }

  restartGame(){
    this.updateState(this.STATES.RESETTING);
    const oldBlocks = [...this.placedBlocks.children];
    const removeSpeed = 0.2;
    const delayAmount = 0.02;

    for (let i=0;i<oldBlocks.length;i++){
      gsap.to(oldBlocks[i].scale, {duration:removeSpeed, x:0,y:0,z:0, delay:(oldBlocks.length-i)*delayAmount, ease:"power1.in", onComplete:()=>this.placedBlocks.remove(oldBlocks[i])});
      gsap.to(oldBlocks[i].rotation,{duration:removeSpeed, y:0.5, delay:(oldBlocks.length-i)*delayAmount, ease:"power1.in"});
    }
    const cameraMoveSpeed = removeSpeed*2 + (oldBlocks.length*delayAmount);
    this.stage.setCamera(2, cameraMoveSpeed);

    const counter = {v:this.blocks.length - 1};
    gsap.to(counter, {duration:cameraMoveSpeed, v:0, onUpdate:()=>{ this.scoreContainer.innerHTML = String(Math.round(counter.v)); }});

    this.blocks = this.blocks.slice(0,1);
    setTimeout(()=>this.startGame(), cameraMoveSpeed*1000);
  }

  placeBlock(){
    const current = this.blocks[this.blocks.length-1];
    const result  = current.place();
    this.newBlocks.remove(current.mesh);
    if (result.placed) this.placedBlocks.add(result.placed);
    if (result.chopped){
      this.choppedBlocks.add(result.chopped);
      const posParams = { y: "-=30", ease:"power1.in", onComplete:()=>this.choppedBlocks.remove(result.chopped)};
      const rotParams = { delay:0.05, x: (result.plane==='z')?((Math.random()*10)-5):0.1, z:(result.plane==='x')?((Math.random()*10)-5):0.1, y: Math.random()*0.1 };
      if (result.chopped.position[result.plane] > result.placed.position[result.plane]) posParams[result.plane] = "+="+(40*Math.abs(result.direction));
      else posParams[result.plane] = "-="+(40*Math.abs(result.direction));
      gsap.to(result.chopped.position, {duration:1, ...posParams});
      gsap.to(result.chopped.rotation, {duration:1, ...rotParams});
    }
    this.addBlock();
  }

  addBlock(){
    const last = this.blocks[this.blocks.length-1];
    if (last && last.state === last.STATES.MISSED) return this.endGame();

    this.scoreContainer.innerHTML = String(this.blocks.length - 1);

    const block = new Block(last);
    this.newBlocks.add(block.mesh);
    this.blocks.push(block);

    this.stage.setCamera(this.blocks.length*2);
    if (this.blocks.length >= 5) this.instructions.classList.add('hide');
  }

  endGame(){ this.updateState(this.STATES.ENDED); }

  tick(){
    if (this.blocks.length) this.blocks[this.blocks.length-1].tick();
    this.stage.render();
    requestAnimationFrame(()=>this.tick());
  }
}

new Game();
</script>
</body>
</html>
