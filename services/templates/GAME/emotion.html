<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>情緒配對小遊戲（無文字提示）</title>
  <style>
    :root{
      --bg:#eaf7ff; --panel:#ffffff; --accent:#22c55e; --accent-2:#ef4444; --text:#1f2937; --muted:#6b7280;
      --card:#ffffff; --card-hover:#f0f9ff; --focus:#60a5fa; --border:#dbeafe; --shadow:0 10px 24px rgba(61,139,255,.15);
      --blob1:#c7f2ff; --blob2:#ffdce5; --blob3:#fff6cc; --back-top:16px; --back-left:16px;
    }
    html,body{height:100%;}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Noto Sans TC",Arial;
      background:
        radial-gradient(1200px 800px at 85% -10%, var(--blob1) 0%, transparent 60%),
        radial-gradient(1000px 700px at -10% 110%, var(--blob2) 0%, transparent 60%),
        radial-gradient(900px 600px at 110% 90%, var(--blob3) 0%, transparent 60%),
        var(--bg);
      color:var(--text); display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .app{ width:min(1024px, 100%);}  
    .panel{ background:var(--panel); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--border);}    
    header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); background:linear-gradient(#ffffff, #f8fbff);}    
    .title{ font-size:18px; letter-spacing:.05em; color:#3b82f6; font-weight:800}
    .toggles{ display:flex; gap:12px; align-items:center;}
    .btn{ background:linear-gradient(180deg,#ffffff,#f5f9ff); border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.06);}    
    .btn:focus{ outline:3px solid var(--focus); outline-offset:2px;}
    .btn.secondary{ background:linear-gradient(180deg,#fff,#fff); border-color:#e5e7eb; color:#6b7280}

    .hud{ display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:20px;}
    .prompt{ font-size:clamp(22px, 6vw, 36px); font-weight:900; color:#0f172a}
    .prompt small{ display:block; font-weight:600; color:var(--muted); font-size:.56em}
    .stat{ background:#ffffff; border:1px solid var(--border); padding:10px 14px; border-radius:12px; font-weight:800; min-width:120px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.04)}

    .grid{ padding:8px 20px 24px; display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
    .card{ background:var(--card); border:2px solid var(--border); border-radius:18px; padding:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .08s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease; min-height:110px; box-shadow:0 6px 14px rgba(0,0,0,.05)}
    .card:hover{ background:var(--card-hover); transform:translateY(-2px); box-shadow:0 10px 18px rgba(0,0,0,.08)}
    .card:active{ transform:translateY(0)}
    .card[aria-pressed="true"]{ outline:3px solid var(--focus); outline-offset:2px;}
    .emoji{ font-size:clamp(48px, 8.5vw, 74px); line-height:1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.06)); }

    .card.correct{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent) inset, 0 8px 20px rgba(34,197,94,.18)}
    .card.wrong{ border-color:var(--accent-2); box-shadow:0 0 0 3px var(--accent-2) inset, 0 8px 20px rgba(239,68,68,.16)}

    .footer{ padding:16px 20px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; color:var(--muted); background:linear-gradient(#fdfefe,#f7fbff)}

    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

    @media (max-width: 640px){ .grid{ grid-template-columns:repeat(2, 1fr);} }

    /* 返回鈕 */
    #back-button{
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + var(--back-top));
      left: calc(env(safe-area-inset-left, 0px) + var(--back-left));
      z-index: 10000;
      display:inline-flex;align-items:center;gap:8px;
      font-size:16px;line-height:1;
      color:#d63384;
      background: rgba(255,255,255,.9);
      padding:10px 16px;border-radius:24px;text-decoration:none;font-weight:800;
      box-shadow:0 4px 12px rgba(0,0,0,.18);
      transition: background-color .2s, transform .06s ease-in-out;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #back-button:hover{ background: #fff; }
    #back-button:active{ transform: scale(.98); }
  </style>
</head>
<body data-logout-url="{{ url_for('auth.logout') }}">
  <script src="{{ url_for('static', filename='js/parent_timer.js') }}?v=20251025-6"></script>
  <a href="{{ url_for('auth.home') }}" id="back-button" aria-label="返回首頁">← 返回首頁</a>

  <div class="app">
    <div class="panel" role="application" aria-label="情緒配對小遊戲">
      <header>
        <div class="title">🌈 情緒配對小遊戲</div>
        <div class="toggles">
          <button class="btn secondary" id="voiceBtn" aria-pressed="false" title="語音提示（需瀏覽器支援）">🔈 語音</button>
          <button class="btn" id="restartBtn">重新開始</button>
        </div>
      </header>

      <div class="hud">
        <div class="prompt" aria-live="polite">
          題目：
          <span id="promptText">—</span>
          <small>請點選下方正確的表情卡（可按數字 1–6 快速作答）</small>
        </div>
        <div class="stat" id="progress">進度：0 / 6</div>
        <div class="stat" id="score">得分：0</div>
      </div>

      <div class="grid" id="grid" role="group" aria-label="答案選項"></div>

      <div class="footer">
        <div>基本情緒：開心、難過、生氣、害怕、驚訝、厭惡</div>
        <div>鍵盤快速鍵：1–6</div>
      </div>
    </div>
  </div>
  <!-- 全站倒數提醒容器（60s / 30s / 5s 用） -->
<div id="sysCenterWarn" class="sysset-center-warn" aria-hidden="true">
  <div class="sysset-center-box" id="sysCenterWarnBox"></div>
</div>
  <template id="cardTemplate">
    <button class="card" type="button">
      <span class="emoji" aria-hidden="true"></span>
      <span class="sr-only optionText"></span>
    </button>
  </template>

  <script>
    /* —— 返回邏輯 + 自動避位 —— */
    (function(){
      const backBtn = document.getElementById('back-button');
      backBtn.addEventListener('click', function(e){
        try{
          const ref = document.referrer;
          if(ref){
            const r = new URL(ref);
            if(r.origin === location.origin){
              e.preventDefault();
              history.back();
              return;
            }
          }
        }catch(_e){}
      });
      function avoidOverlap(){
        document.documentElement.style.setProperty('--back-left','16px');
        document.documentElement.style.setProperty('--back-top','16px');
        const rect = backBtn.getBoundingClientRect();
        let step=8, shifted=0, maxShift=240;
        function covered(){
          const pts=[[rect.left+4,rect.top+4],[rect.left+rect.width/2,rect.top+rect.height/2]];
          return pts.some(([x,y])=>{
            const el=document.elementFromPoint(x,y);
            return el && el!==backBtn && !backBtn.contains(el) && el!==document.body && el!==document.documentElement;
          });
        }
        while(covered() && shifted<=maxShift){
          shifted+=step;
          document.documentElement.style.setProperty('--back-left',(16+shifted)+'px');
          const r2=backBtn.getBoundingClientRect();
          rect.left=r2.left; rect.top=r2.top; rect.width=r2.width; rect.height=r2.height;
        }
      }
      window.addEventListener('load', ()=> setTimeout(avoidOverlap, 0));
      window.addEventListener('resize', ()=> setTimeout(avoidOverlap, 0));
    })();

    // 題庫
    const EMOTIONS = [
      { id:'happy',    zh:'開心',  emoji:'😄' },
      { id:'sad',      zh:'難過',  emoji:'😢' },
      { id:'angry',    zh:'生氣',  emoji:'😡' },
      { id:'fear',     zh:'害怕',  emoji:'😱' },
      { id:'surprise', zh:'驚訝',  emoji:'😲' },
      { id:'disgust',  zh:'厭惡',  emoji:'🤢' },
    ];

    const TOTAL_QUESTIONS = 6;
    const state = { order: [], index: 0, score: 0, speaking: false };

    const el = {
      grid: document.getElementById('grid'),
      prompt: document.getElementById('promptText'),
      progress: document.getElementById('progress'),
      score: document.getElementById('score'),
      restart: document.getElementById('restartBtn'),
      voiceBtn: document.getElementById('voiceBtn'),
      tpl: document.getElementById('cardTemplate')
    };
    const promptWrap = document.querySelector('.prompt');

    function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

    function speak(text){
      if(!('speechSynthesis' in window)) return Promise.resolve();
      return new Promise(resolve=>{
        try{
          const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW';
          state.speaking=true;
          u.onend=()=>{ state.speaking=false; resolve(); };
          u.onerror=()=>{ state.speaking=false; resolve(); };
          speechSynthesis.cancel(); speechSynthesis.speak(u);
        }catch(e){ resolve(); }
      });
    }

    function setupOptions(){
      el.grid.innerHTML='';
      const order = shuffle(EMOTIONS);
      order.forEach((emo, idx)=>{
        const node = el.tpl.content.firstElementChild.cloneNode(true);
        node.dataset.id = emo.id;
        node.setAttribute('aria-label', `選項 ${idx+1}`);
        node.querySelector('.emoji').textContent = emo.emoji;
        node.querySelector('.optionText').textContent = `選項 ${idx+1}`;
        node.addEventListener('click', ()=> handleChoose(emo.id, node));
        el.grid.appendChild(node);
      });

      window.onkeydown = (ev)=>{
        const n = Number(ev.key);
        if(n>=1 && n<=6){ const btn = el.grid.children[n-1]; if(btn) btn.click(); }
        if(ev.key === ' '){ ev.preventDefault(); speakQuestion(); }
      }
    }

    async function nextQuestion(){
      if(state.index >= TOTAL_QUESTIONS){ endGame(); return; }
      const answerEmo = state.order[state.index];
      el.prompt.textContent = answerEmo.zh;
      el.progress.textContent = `進度：${state.index+1} / ${TOTAL_QUESTIONS}`;
      el.score.textContent = `得分：${state.score}`;
      setupOptions();
      if(el.voiceBtn.getAttribute('aria-pressed') === 'true'){
        await speakQuestion();
      }
    }

    async function handleChoose(chosenId, node){
      const answerId = state.order[state.index].id;
      const isCorrect = chosenId === answerId;
      node.classList.add(isCorrect ? 'correct' : 'wrong');
      Array.from(el.grid.children).forEach(btn=> btn.disabled = true);

      const voiceOn = el.voiceBtn.getAttribute('aria-pressed') === 'true';
      if(voiceOn){
        await speak(isCorrect ? '太棒了，答對！' : '再試試看');
        await delay(300);
      }else{
        await delay(900);
      }
      if(isCorrect) state.score += 1;

      state.index += 1;
      nextQuestion();
    }

    function startTimer(){} // 此遊戲無計時，保留介面一致性

    function endGame(){
      el.grid.innerHTML='';
      promptWrap.style.display = 'none';
      el.progress.textContent = `進度：${TOTAL_QUESTIONS} / ${TOTAL_QUESTIONS}`;
      el.score.textContent = `得分：${state.score}`;

      const result = document.createElement('div');
      result.style.padding='8px 20px 24px';
      result.innerHTML = `
        <div style="background:#ffffff;border:1px solid var(--border);border-radius:14px;padding:18px;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.06)">
          <div style="font-weight:900;font-size:22px;margin-bottom:6px;color:#0ea5e9">做得好！</div>
          你在 <strong>${TOTAL_QUESTIONS}</strong> 題中答對了 <strong>${state.score}</strong> 題。
          <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn" onclick="startGame()">再玩一次</button>
            <button class="btn secondary" onclick="navigator.clipboard && navigator.clipboard.writeText(location.href)">複製連結</button>
          </div>
        </div>`;
      el.grid.parentElement.appendChild(result);

      if(el.voiceBtn.getAttribute('aria-pressed') === 'true') speak(`完成！得分 ${state.score} 分`);
    }

    function speakQuestion(){ const q=el.prompt.textContent.trim(); if(!q) return Promise.resolve(); return speak(`請找：${q} 的表情`); }
    function delay(ms){ return new Promise(r=> setTimeout(r, ms)); }

    function startGame(){
      promptWrap.style.display = '';
      state.order = shuffle(EMOTIONS).slice(0, TOTAL_QUESTIONS);
      state.index = 0;
      state.score = 0;
      nextQuestion();
    }

    el.restart.addEventListener('click', startGame);
    el.voiceBtn.addEventListener('click', async ()=>{
      const pressed = el.voiceBtn.getAttribute('aria-pressed') === 'true';
      el.voiceBtn.setAttribute('aria-pressed', String(!pressed));
      el.voiceBtn.textContent = (!pressed ? '🔊 語音開啟' : '🔈 語音');
      if(!pressed){ await speak('語音提示已開啟'); }
    });

    startGame();
  </script>
</body>
</html>
